<link href="https://unpkg.com/maplibre-gl@3.x/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://unpkg.com/maplibre-gl@3.x/dist/maplibre-gl.js"></script>

  maplibregl.setRTLTextPlugin(

<script src="/socket.io/socket.io.js"></script>
<script src="https://cdn.bootcdn.net/ajax/libs/flv.js/1.6.2/flv.min.js"></script>
<style>
/* =====================================================================
   VisionGuard - Command Center design system
   Tokens are mirrored in the Flutter client (app/lib/core/theme).
   ===================================================================== */
:root{
  --bg:#E9EEF5;--panel:#F8FAFC;--raise:#EEF2F8;--line:#DAE2EC;--line-soft:#E6ECF3;
  --text:#0F1B2D;--mut:#62738C;
  --brand:#5E4A9E;
  --ok:#00B87C;--rec:#FF3355;--off:#9AA8BD;--blue:#2F7BFF;
  --sel:#FFB300;--sel-ink:#1A1405;--accent-text:#9A6400;
  --mine:#DCE9FF;--track:#C9D4E3;--flash:#FFD3DA;--hover:#E4EBF5;
  --glass:rgba(10,16,28,.46);
  --shadow-sm:0 1px 2px rgba(15,27,45,.05),0 2px 6px rgba(15,27,45,.06);
  --shadow-md:0 10px 30px rgba(15,27,45,.12);
  --glow-amber:0 0 0 1px rgba(255,179,0,.55),0 4px 18px rgba(255,179,0,.38);
  --glow-blue:0 0 0 1px rgba(47,123,255,.5),0 4px 18px rgba(47,123,255,.32);
  --glow-rec:0 0 0 1px rgba(255,51,85,.5),0 4px 18px rgba(255,51,85,.38);
  --glow-ok:0 0 0 1px rgba(0,184,124,.5),0 4px 16px rgba(0,184,124,.34);
  --canvas:radial-gradient(900px 420px at 8% -8%,rgba(94,74,158,.13),transparent 70%),radial-gradient(800px 420px at 100% 0,rgba(47,123,255,.12),transparent 70%),#E9EEF5;
  --r:16px;--gap:14px;--header-h:78px;
  font-family:Bahnschrift,"Segoe UI",system-ui,sans-serif;font-variant-numeric:tabular-nums;color-scheme:light}
:root[data-theme="dark"]{
  --bg:#0B1322;--panel:#131E33;--raise:#1A2842;--line:#273A5B;--line-soft:#1F3050;
  --text:#E8EEF7;--mut:#8A9BB5;
  --brand:#9B86E0;
  --ok:#2EE6A6;--rec:#FF5D77;--off:#5B6B86;--blue:#5AA9FF;
  --sel:#FFC857;--accent-text:#FFC857;
  --mine:rgba(90,169,255,.24);--track:rgba(255,255,255,.2);--flash:#5A2030;--hover:#1A2842;
  --shadow-sm:0 1px 2px rgba(0,0,0,.35);--shadow-md:0 10px 30px rgba(0,0,0,.45);
  --canvas:radial-gradient(900px 420px at 8% -8%,rgba(155,134,224,.16),transparent 70%),radial-gradient(800px 420px at 100% 0,rgba(90,169,255,.12),transparent 70%),#0B1322;
  color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;height:100vh;background:var(--canvas);color:var(--text);display:grid;grid-template-rows:var(--header-h) 1fr;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,.cam:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
*{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:var(--off)}
::-webkit-scrollbar-track{background:transparent}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- cards ---------- */
.card,aside,#mapwrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm)}
.sec{padding:14px 16px 10px;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--mut);display:flex;align-items:center;justify-content:space-between;gap:8px}
.sec>span:first-child{display:flex;align-items:center;gap:8px}
.sec>span:first-child::before{content:"";width:4px;height:14px;border-radius:2px;background:linear-gradient(var(--sel),var(--brand))}
.sec small{color:var(--text);background:var(--raise);border:1px solid var(--line-soft);border-radius:99px;padding:2px 10px;font-weight:600;text-transform:none;letter-spacing:0;font-size:11.5px}

/* ---------- header ---------- */
header{display:flex;align-items:center;gap:18px;padding:0 20px;margin:0;background:linear-gradient(180deg,var(--panel),var(--raise));border-bottom:1px solid var(--line);box-shadow:var(--shadow-sm);position:relative;z-index:5}
header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,var(--brand),var(--blue) 45%,var(--sel));opacity:.9}
.brand{display:flex;align-items:center;gap:14px;flex:none}
.brand img{height:38px;width:auto;display:block}
.logo-dark{display:none!important}
:root[data-theme="dark"] .logo-light{display:none!important}
:root[data-theme="dark"] .logo-dark{display:block!important}
.brand-sep{width:1px;height:38px;background:var(--line)}
.brand-text{display:flex;flex-direction:column;line-height:1.2}
.brand-text strong{font-size:17px;font-weight:700;letter-spacing:.4px}
.brand-text small{font-size:11px;color:var(--mut);letter-spacing:.8px;text-transform:uppercase}
.stats{display:flex;gap:12px;margin-left:10px}
.stat{display:flex;align-items:center;gap:12px;min-width:150px;padding:8px 16px 8px 10px;background:linear-gradient(135deg,var(--panel),var(--raise));border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-sm);transition:.2s}
.stat .si{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);box-shadow:0 0 16px color-mix(in srgb,var(--c) 38%,transparent)}
.stat .si svg{width:19px;height:19px}
.stat div{display:flex;flex-direction:column;line-height:1.05}
.stat b{font-size:26px;font-weight:700;color:var(--text);letter-spacing:.3px}
.stat div>span{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.8px;margin-top:3px}
.stat.ok{--c:var(--ok)}.stat.rec{--c:var(--rec)}.stat.all{--c:var(--blue)}.stat.alert{--c:var(--sel)}
.stat.alert.hot{--c:var(--rec);border-color:color-mix(in srgb,var(--rec) 45%,var(--line));box-shadow:var(--glow-rec)}
.stat.alert.hot b{color:var(--rec)}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.clock{font-size:14px;font-weight:600;padding:8px 14px;background:var(--raise);border:1px solid var(--line);border-radius:10px;letter-spacing:.3px;white-space:nowrap}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--mut);display:flex;align-items:center;justify-content:center;flex:none;transition:.15s}
.icon-btn:hover{background:var(--hover);color:var(--text);box-shadow:var(--glow-amber)}
.icon-btn svg{width:18px;height:18px}
:root[data-theme="dark"] .ico-moon,:root:not([data-theme="dark"]) .ico-sun{display:none}
.user{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;padding-left:14px;border-left:1px solid var(--line)}
.user::before{content:"";width:34px;height:34px;border-radius:50%;flex:none;background:center/17px no-repeat url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%231a1405'><path d='M12 12a4 4 0 100-8 4 4 0 000 8zm0 2c-3.3 0-8 1.7-8 5v1h16v-1c0-3.3-4.7-5-8-5z'/></svg>"),linear-gradient(135deg,var(--sel),#ff8a00);box-shadow:var(--glow-amber)}
.user .btn{flex:none;padding:7px 13px;font-weight:500}

.lang-switch{display:flex;align-items:center;background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;flex:none}
.lang-btn{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:7px;border:none;background:transparent;color:var(--mut);font-size:12px;font-weight:600;transition:.2s}
.lang-btn svg{width:18px;height:13px;border-radius:2px;flex:none}
.lang-btn.active{background:var(--panel);color:var(--text);box-shadow:var(--shadow-sm)}

/* ---------- layout (bento) ---------- */
main{display:grid;grid-template-columns:clamp(290px,19vw,340px) minmax(0,1fr) clamp(540px,42vw,820px);gap:var(--gap);padding:var(--gap);min-height:0}
aside{display:flex;flex-direction:column;min-height:0;overflow:hidden}
#mapwrap{position:relative;min-height:0;direction:ltr;overflow:hidden}
#map{position:absolute;inset:0}
.map-chip{position:absolute;top:14px;left:14px;z-index:3;display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:99px;font-size:11.5px;font-weight:700;letter-spacing:1px;color:var(--text);background:color-mix(in srgb,var(--panel) 80%,transparent);backdrop-filter:blur(10px);border:1px solid var(--line);box-shadow:var(--shadow-sm)}
.map-chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(0,184,124,.6);animation:pulseOnline 1.6s infinite}
#right{display:grid;grid-template-rows:minmax(0,1.3fr) minmax(250px,1fr);gap:var(--gap);min-height:0}
#wallCard{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.bottom{display:grid;grid-template-columns:minmax(190px,.8fr) minmax(0,1.35fr);gap:var(--gap);min-height:0}
#alarmCard{display:flex;flex-direction:column;min-height:0;overflow:hidden}

/* ---------- fleet sidebar ---------- */
.regions{display:flex;gap:6px;padding:0 14px 10px;overflow-x:auto;flex:none}
.reg{flex:none;display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;border:1px solid var(--line);background:var(--panel);font-size:12.5px;font-weight:700;color:var(--mut);transition:.15s;white-space:nowrap}
.reg:hover{background:var(--hover);color:var(--text)}
.reg.on{background:linear-gradient(135deg,var(--sel),#ff9d00);border-color:transparent;color:var(--sel-ink);box-shadow:0 3px 12px rgba(255,179,0,.4)}
.reg small{font-size:10.5px;font-weight:800;padding:1px 6px;border-radius:99px;background:color-mix(in srgb,currentColor 14%,transparent)}
.cohead{display:flex;align-items:center;gap:8px;padding:10px 6px 6px;font-size:11.5px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;color:var(--mut);cursor:pointer;user-select:none}
.cohead:hover{color:var(--text)}
.cohead i{font-style:normal;display:inline-block;transition:transform .15s;font-size:10px}
.cohead.shut i{transform:rotate(-90deg)}
.cohead .cnt{margin-left:auto;font-size:10.5px;padding:2px 8px;border-radius:99px;background:var(--raise);border:1px solid var(--line-soft);letter-spacing:0;text-transform:none;color:var(--text)}
.cohead .cnt b{color:var(--ok)}
.search{position:relative;margin:0 14px 10px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--mut);width:15px;height:15px}
#q{width:100%;padding:10px 12px 10px 34px;border-radius:12px;border:1px solid var(--line);background:var(--raise);color:var(--text);font:inherit;font-size:14px}
#q:focus{background:var(--panel);border-color:var(--sel);box-shadow:var(--glow-amber)}
.chips{display:flex;gap:4px;margin:0 14px 12px;padding:3px;background:var(--raise);border:1px solid var(--line-soft);border-radius:12px}
.chip{flex:1;padding:6px 8px;border-radius:9px;border:0;background:none;font-size:12.5px;color:var(--mut);font-weight:600;transition:.15s}
.chip:hover{color:var(--text)}
.chip.on{background:var(--panel);color:var(--text);box-shadow:var(--shadow-sm),inset 0 -2px 0 var(--sel)}
#list{flex:1;overflow:auto;padding:0 10px 12px}
.cam{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:13px;cursor:pointer;margin-bottom:8px;background:var(--panel);border:1px solid var(--line-soft);transition:.15s}
.cam:hover{background:var(--hover);transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.cam.sel{border-color:var(--sel);box-shadow:var(--glow-amber);background:color-mix(in srgb,var(--sel) 7%,var(--panel))}
.dot{width:12px;height:12px;border-radius:50%;background:var(--off);flex:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--off) 22%,transparent)}
.online .dot{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent),0 0 10px var(--ok)}
.rec .dot{background:var(--rec);box-shadow:0 0 0 3px color-mix(in srgb,var(--rec) 25%,transparent),0 0 10px var(--rec)}
.meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.meta b{font-size:14px;line-height:1.25}
.meta small{color:var(--mut);font-size:11.5px;line-height:1.3}
.badge{font-size:10.5px;font-weight:800;letter-spacing:.6px;color:#fff;background:var(--rec);border-radius:6px;padding:3px 7px;box-shadow:0 0 10px color-mix(in srgb,var(--rec) 55%,transparent);flex:none}
.badge.talk{background:var(--ok);color:#042a1d;box-shadow:0 0 10px color-mix(in srgb,var(--ok) 55%,transparent)}
.cam button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--panel);flex:none;color:var(--blue);font-size:12px;transition:.15s}
.cam button:hover{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:var(--glow-blue)}
.none{padding:24px 14px;color:var(--mut);font-size:14px;line-height:1.5}

/* ---------- map ---------- */
.mk{width:22px;height:22px;border-radius:50%;background:var(--off);border:3px solid #fff;box-shadow:0 0 0 1px rgba(15,27,45,.35),0 3px 8px rgba(15,27,45,.35);cursor:pointer;position:absolute;z-index:9999 !important;transform:translate(-50%,-50%)}
.mk.online{background:var(--ok);animation:pulseOnline 1.5s infinite}
.mk.rec{background:var(--rec);animation:pulseRec 1.5s infinite}
.mk.off{background:var(--off)}
.mk.sel{box-shadow:0 0 0 4px var(--sel),0 0 18px var(--sel)}
.mk.stale{opacity:.5;filter:grayscale(.7);animation:none!important;border-style:dashed}
@keyframes pulseRec{0%{box-shadow:0 0 0 0 rgba(255,51,85,.65)}100%{box-shadow:0 0 0 16px rgba(255,51,85,0)}}
@keyframes pulseOnline{0%{box-shadow:0 0 0 0 rgba(0,184,124,.6)}100%{box-shadow:0 0 0 16px rgba(0,184,124,0)}}
#info{position:absolute;left:14px;bottom:14px;width:300px;background:color-mix(in srgb,var(--panel) 84%,transparent);backdrop-filter:blur(14px) saturate(150%);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:none;box-shadow:var(--shadow-md);z-index:3}
#info h3{margin:0 0 4px;font-size:18px}
#info p{margin:3px 0;color:var(--mut);font-size:13px}
#info .row{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;padding:8px 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-size:14px;transition:.15s}
.btn:hover{background:var(--hover)}
.btn.pri{background:linear-gradient(135deg,var(--sel),#ff9d00);border-color:transparent;color:var(--sel-ink);font-weight:700;box-shadow:0 3px 12px rgba(255,179,0,.4)}
.btn.pri:hover{filter:brightness(1.05)}
.btn.on{border-color:var(--sel);color:var(--accent-text);box-shadow:var(--glow-amber)}
.lay{display:flex;gap:3px;padding:3px;background:var(--raise);border:1px solid var(--line-soft);border-radius:10px}
.lay button{padding:3px 11px;border-radius:7px;border:1px solid transparent;background:none;font-size:12.5px;color:var(--mut);font-weight:600;text-transform:none;letter-spacing:0}
.lay button.on{background:var(--panel);color:var(--text);border-color:var(--line);box-shadow:var(--shadow-sm)}

/* ---------- live wall: glass tiles ---------- */
#wall{flex:1;display:grid;gap:10px;padding:0 14px 14px;min-height:0;overflow:auto;align-content:start}
.tile{position:relative;container-type:inline-size;background:radial-gradient(120% 100% at 50% 0,#16233a,#0A111D);border-radius:14px;overflow:hidden;border:1px solid rgba(120,140,175,.28);min-height:0;aspect-ratio:16/9;box-shadow:var(--shadow-sm);color:#EAF0FA;transition:box-shadow .2s,border-color .2s}
.tile:hover{border-color:rgba(255,179,0,.55);box-shadow:0 6px 22px rgba(15,27,45,.28)}
.tile video{width:100%;height:100%;object-fit:contain;display:block;background:#0A111D}
.tile.fit video{object-fit:cover}
.tile.talking{border-color:var(--ok);box-shadow:var(--glow-ok)}
.tag{position:absolute;top:8px;left:8px;right:8px;display:flex;align-items:center;gap:6px;padding:5px;border-radius:12px;pointer-events:none;z-index:2;color:#fff;font-size:12.5px;background:var(--glass);backdrop-filter:blur(12px) saturate(150%);border:1px solid rgba(255,255,255,.14);box-shadow:0 4px 16px rgba(0,0,0,.25)}
.tag .nm{font-weight:700;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pill{flex:none;display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:800;letter-spacing:.8px;background:rgba(154,168,189,.25);color:#C5D0E2}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:#9AA8BD}
.pill::after{content:"WAITING"}
body[dir="rtl"] .pill::after{content:"انتظار"}
.tile.live .pill{background:rgba(255,51,85,.22);color:#FFB3C0;box-shadow:0 0 12px rgba(255,51,85,.45)}
.tile.live .pill::before{background:var(--rec);animation:pulseRec 1.4s infinite}
.tile.live .pill::after{content:"REC"}
body[dir="rtl"] .tile.live .pill::after{content:"تسجيل"}
.tag button{pointer-events:auto;height:26px;min-width:26px;border-radius:8px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.1);color:#fff;font-size:11.5px;font-weight:600;padding:0 8px;display:inline-flex;align-items:center;justify-content:center;gap:5px;transition:.15s;flex:none}
.tag button:hover{background:rgba(255,255,255,.24);border-color:rgba(255,255,255,.4)}
.tag button.on{background:rgba(0,184,124,.35);border-color:rgba(46,230,166,.7);box-shadow:0 0 12px rgba(0,184,124,.5)}
.tag button[data-x]:hover{background:rgba(255,51,85,.6);border-color:rgba(255,51,85,.9)}
.tag .pill+button{margin-left:auto}
body[dir="rtl"] .tag .pill+button{margin-left:0;margin-right:auto}
.tag button svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
@container (max-width:330px){.tag .lbl{display:none}.tag button{padding:0 6px}}
@container (max-width:240px){.tag .pill{display:none}}
.wait,.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#8FA2BF;font-size:13px;text-align:center;padding:12px}
.wait{padding-top:44px}
.qrow{align-items:center;justify-content:space-between;font-size:13px;color:var(--mut)}
.qrow select{padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--raise);font:inherit;color:var(--text)}
.reqbtn{pointer-events:auto;margin-top:6px;padding:7px 16px;border-radius:99px;border:0;font-weight:700;font-size:12.5px;color:var(--sel-ink);background:linear-gradient(135deg,var(--sel),#ff9d00);box-shadow:0 4px 14px rgba(255,179,0,.45)}
.flash-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:30000;padding:11px 20px;border-radius:12px;background:var(--text);color:var(--bg);font-weight:600;box-shadow:var(--shadow-md)}
.wait::before{content:"";width:24px;height:24px;border-radius:50%;border:2px solid rgba(143,162,191,.3);border-top-color:var(--sel);animation:spin 1s linear infinite}
.empty{inset:8px;border:1.5px dashed rgba(143,162,191,.35);border-radius:10px}
.empty small{font-size:11.5px;opacity:.8}
.tile.live .wait{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
body.theater::before{content:"";position:fixed;inset:0;background:rgba(8,13,24,.8);backdrop-filter:blur(5px);z-index:20000}
.tile.expanded{position:fixed;z-index:20001;top:50%;left:50%;transform:translate(-50%,-50%);width:min(92vw,calc(86vh*16/9));height:auto;aspect-ratio:16/9;max-height:86vh;border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.65);border-color:rgba(255,255,255,.28)}
.tile.expanded .tag{font-size:14px;top:12px;left:12px;right:12px}
.tile.expanded .tag button{height:32px;min-width:32px;font-size:13px}
.tile.expanded .tag .lbl{display:inline}
.tile.expanded .tag .pill{display:inline-flex}

/* ---------- alarms ---------- */
#alarms{flex:1;overflow:auto;padding:0 10px 10px;min-height:0}
.al{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:12px;cursor:pointer;border:1px solid color-mix(in srgb,var(--rec) 35%,var(--line));margin-bottom:8px;background:color-mix(in srgb,var(--rec) 9%,var(--panel));box-shadow:inset 3px 0 0 var(--rec)}
.al.ack{box-shadow:inset 3px 0 0 var(--off);border-color:var(--line-soft);background:none;color:var(--mut)}
.al b{flex:1;min-width:110px;font-size:13px}
.al small{color:var(--mut)}

/* ---------- chat & voice notes ---------- */
#chat-section{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.chat-tabs{display:flex;gap:6px;padding:12px 12px 8px;border-bottom:1px solid var(--line-soft);align-items:center;overflow-x:auto;overflow-y:visible;white-space:nowrap;flex:none}
.chat-tab{padding:5px 13px;border-radius:99px;border:1px solid var(--line);background:var(--panel);font-size:12px;font-weight:600;color:var(--mut);position:relative;display:inline-flex;align-items:center;gap:6px;cursor:pointer;flex:none;margin-top:6px;transition:.15s}
.chat-tab:hover{background:var(--hover)}
.chat-tab.active{background:linear-gradient(135deg,var(--sel),#ff9d00);color:var(--sel-ink);border-color:transparent;box-shadow:0 3px 12px rgba(255,179,0,.4)}
.chat-tab .close-tab{font-size:11px;opacity:.7;border:none;background:none;padding:0 2px;color:inherit}
.chat-tab .close-tab:hover{opacity:1;color:var(--rec)}
.chat-badge{position:absolute;top:-9px;right:-6px;background:var(--rec);color:#fff;border-radius:50%;min-width:18px;height:18px;padding:0 4px;font-size:10px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;box-shadow:var(--glow-rec);border:2px solid var(--panel);z-index:10}
#chat-msgs{flex:1;overflow:auto;padding:10px 14px;display:flex;flex-direction:column;gap:8px;min-height:0;background:var(--raise)}
.chat-msg{font-size:13px;padding:7px 11px;border-radius:14px;max-width:88%;box-shadow:var(--shadow-sm)}
.chat-msg.mine{background:var(--mine);align-self:flex-end;border-bottom-right-radius:4px}
.chat-msg.other{background:var(--panel);align-self:flex-start;border:1px solid var(--line-soft);border-bottom-left-radius:4px}
.chat-msg b{color:var(--accent-text);font-size:11px;display:block;margin-bottom:2px}
.chat-composer{display:flex;align-items:center;padding:10px 12px;gap:8px;border-top:1px solid var(--line-soft);background:var(--panel);flex:none}
.mic-btn{background:var(--raise);border:1px solid var(--line);color:var(--mut);width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s;flex:none}
.mic-btn:hover{color:var(--accent-text);box-shadow:var(--glow-amber)}
.mic-btn.recording{color:#fff;background:var(--rec);border-color:var(--rec);animation:pulseRec 1s infinite}
.chat-composer input{flex:1;min-width:0;padding:9px 14px;border-radius:99px;border:1px solid var(--line);background:var(--raise);color:var(--text);font:inherit;font-size:13px}
.chat-composer input:focus{background:var(--panel);border-color:var(--sel);box-shadow:var(--glow-amber)}
.chat-composer button.send-btn{padding:9px 18px;border-radius:99px;border:none;background:linear-gradient(135deg,var(--sel),#ff9d00);color:var(--sel-ink);font-weight:700;font-size:13px;box-shadow:0 3px 12px rgba(255,179,0,.4)}

.voice-msg{display:flex;align-items:center;gap:10px;min-width:200px}
.voice-play-btn{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--sel),#ff9d00);border:none;color:var(--sel-ink);display:flex;align-items:center;justify-content:center;font-size:13px;flex:none;cursor:pointer;box-shadow:0 3px 10px rgba(255,179,0,.45)}
.voice-wave{flex:1;height:28px;display:flex;align-items:center;gap:2px;cursor:pointer}
.voice-wave i{flex:1;max-width:4px;min-width:2px;border-radius:2px;background:var(--track);transition:background .1s}
.voice-wave i.on{background:var(--sel)}
.voice-duration{font-size:11px;color:var(--mut);flex:none;min-width:30px;text-align:right}

header.flash{animation:fl 1s 3}
@keyframes fl{50%{background:var(--flash)}}
.in{width:100%;margin-top:8px;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--raise);color:var(--text);font:inherit}
#snd{position:fixed;top:var(--header-h);left:50%;transform:translateX(-50%);z-index:50;background:var(--sel);color:var(--sel-ink);font-size:14px;font-weight:600;padding:6px 16px;border-radius:0 0 10px 10px;box-shadow:var(--shadow-md)}

@media (max-width:1800px){.brand-sep,.brand-text small,.clock{display:none}.stat{min-width:0;padding-right:12px}}
@media (max-width:1500px){.stat div>span{display:none}}
@media (max-width:1280px){.stats{display:none}}
@media (prefers-reduced-motion:reduce){.mk.rec,.mk.online,header.flash,.wait::before,.tile.live .pill::before,.map-chip::before{animation:none}}
</style>

 <a class="icon-btn" href="/analytics.html" title="Analytics" aria-label="Analytics"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></a>

<script>
const lang = {
  en: {
    online: "online",
    offline: "offline",
    recording: "recording",
    registered: "registered",
    openAlarms: "open alarms",
    cameras: "Cameras",
    searchPlaceholder: "Search by name, group or ID",
    all: "All",
    onlineChip: "Online",
    recChip: "Recording",
    watchLive: "Watch live",
    noGps: "No GPS fix yet",
    noCamerasMatch: "No cameras match. Turn on a body camera and it will appear here automatically.",
    talking: "Talking now (PTT held)",
    follow: "Follow",
    following: "Following",
    liveWall: "Live wall",
    alarmsTitle: "Alarms",
    sosFrom: "SOS from",
    noAlarms: "No alarms. An SOS held on a body camera shows up here instantly.",
    signOut: "Sign out",
    adminRole: "Administrator",
    publicChat: "Public Chat",
    privateWith: "Private: ",
    chatPlaceholder: "Type a message...",
    send: "Send",
    selectCameraFirst: "Please select a camera from the fleet list for private chat."
  },
  ar: {
    online: "متصل",
    offline: "غير متصل",
    recording: "جاري التسجيل",
    registered: "مسجل",
    openAlarms: "إنذارات مفتوحة",
    cameras: "الكاميرات",
    searchPlaceholder: "بحث بالاسم، المجموعة أو المعرف",
    all: "الكل",
    onlineChip: "متصل",
    recChip: "تسجيل",
    watchLive: "متابعة البث",
    noGps: "لا يوجد إحداثيات GPS",
    noCamerasMatch: "لا توجد كاميرات مطابقة. قم بتشغيل كاميرا الجسم وستظهر هنا تلقائياً.",
    talking: "يتحدث الآن (PTT)",
    follow: "متابعة",
    following: "جاري المتابعة",
    liveWall: "حائط البث المباشر",
    alarmsTitle: "الإنذارات",
    sosFrom: "إغاثة SOS من",
    noAlarms: "لا توجد إنذارات. أي إغاثة SOS من كاميرا الجسم ستظهر هنا فوراً.",
    signOut: "تسجيل الخروج",
    adminRole: "مدير النظام",
    publicChat: "العام (Public)",
    privateWith: "خاص: ",
    chatPlaceholder: "اكتب رسالة...",
    send: "إرسال",
    selectCameraFirst: "الرجاء اختيار كاميرا من القائمة أولاً للمحادثة الخاصة."
  }
};

let currentLang = 'en';
const t = (key) => lang[currentLang][key] || key;

const $ = (s) => document.querySelector(s);
const host = location.hostname;
const cams = new Map(), markers = new Map(), players = new Map();
let alarms = [], selected = null, filter = 'all', term = '', follow = false;
let region = 'all', regionList = [], companyList = [];
let shut = new Set(JSON.parse((() => { try { return localStorage.getItem('bwc-shut') || '[]'; } catch (e) { return '[]'; } })()));
const saveShut = () => { try { localStorage.setItem('bwc-shut', JSON.stringify([...shut])); } catch (e) { } };
let me = { role: 'viewer' }, editing = false, currentUser = null;
let layout = 4, slots = [null, null, null, null];

const stateOf = (c) => (c.recording ? 'rec' : c.online ? 'online' : 'off');
const esc = (s) => String(s).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));

function resolveCameraId(id) {
  if (!id || id === 'admin' || id === 'ALL' || id === 'all' || id === 'ADMIN' || id === 'undefined' || id === 'UNKNOWN' || id === 'null') return id;
  if (cams.has(id)) return id;
  
  const cleanId = String(id).trim().toLowerCase();
  for (let [camKey, c] of cams.entries()) {
    const k = camKey.toLowerCase();
    const name = (c.name || '').toLowerCase();
    if (k === cleanId || k.startsWith(cleanId) || cleanId.startsWith(k) || (name && name === cleanId)) {
      return camKey;
    }
  }
  return id;
}

function getOfficerLabel(camId) {
  if (!camId || camId === 'admin' || camId === 'ALL' || camId === 'all' || camId === 'ADMIN' || camId === 'undefined' || camId === 'UNKNOWN' || camId === 'null') {
    return 'Control Room';
  }
  const resolvedId = resolveCameraId(camId);
  const c = cams.get(resolvedId);
  if (c) {
    if (c.name && c.name !== resolvedId) {
      return `${resolvedId} (${c.name})`;
    }
    return resolvedId;
  }
  return camId;
}

const tagOf = (id) => esc(getOfficerLabel(id));

const ago = (ts) => {
  if (!ts) return currentLang === 'ar' ? 'لا توجد إشارة بعد' : 'no signal yet';
  const s = Math.max(0, Math.round((Date.now() - ts) / 1000));
  if (currentLang === 'ar') {
    return s < 60 ? s + ' ثانية' : s < 3600 ? Math.floor(s / 60) + ' دقيقة' : Math.floor(s / 3600) + ' ساعة';
  }
  return s < 60 ? s + 's ago' : s < 3600 ? Math.floor(s / 60) + 'm ago' : Math.floor(s / 3600) + 'h ago';
};

/* ---------- Map ---------- */
const map = new maplibregl.Map({
  container: 'map',
  style: 'https://tiles.openfreemap.org/styles/liberty',
  center: [46.6753, 24.7136], zoom: 14
});

function syncMarker(c) {
  if (c.lat == null || c.lng == null) return;
  const lat = Number(c.lat);
  const lng = Number(c.lng);
  if (isNaN(lat) || isNaN(lng)) return;

  let m = markers.get(c.cameraId);
  if (!m) {
    const el = document.createElement('div');
    el.addEventListener('click', (e) => { e.stopPropagation(); select(c.cameraId, false); });
    m = new maplibregl.Marker({ element: el }).setLngLat([lng, lat]).addTo(map);
    markers.set(c.cameraId, m);
  }
  m.setLngLat([lng, lat]);
  m.getElement().className = 'mk ' + stateOf(c) + (selected === c.cameraId ? ' sel' : '') + (gpsStale(c) ? ' stale' : '');
}
// A position is only "live" if the camera reported a fresh fix in the last 2 minutes; otherwise it is the last known place.
const gpsStale = (c) => !c.fixTs || Date.now() - c.fixTs > 120000;
const agoShort = (ts) => { const s = Math.floor((Date.now() - ts) / 1000); return s < 60 ? s + 's' : s < 3600 ? Math.floor(s / 60) + ' min' : s < 86400 ? Math.floor(s / 3600) + ' h' : Math.floor(s / 86400) + ' d'; };
function circlePoly(lng, lat, r) {
  const pts = [];
  for (let i = 0; i <= 64; i++) { const a = i / 64 * 2 * Math.PI; pts.push([lng + (r * Math.cos(a)) / (111320 * Math.cos(lat * Math.PI / 180)), lat + (r * Math.sin(a)) / 111320]); }
  return { type: 'FeatureCollection', features: [{ type: 'Feature', geometry: { type: 'Polygon', coordinates: [pts] } }] };
}
// accuracy circle around the selected camera
function drawAcc() {
  const src = map.getSource && map.getSource('acc'); if (!src) return;
  const c = cams.get(selected);
  src.setData(c && c.acc && c.lat != null && !gpsStale(c) ? circlePoly(Number(c.lng), Number(c.lat), Math.max(c.acc, 3)) : { type: 'FeatureCollection', features: [] });
}
map.on('load', () => {
  map.addSource('acc', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
  map.addLayer({ id: 'acc-fill', type: 'fill', source: 'acc', paint: { 'fill-color': '#2F7BFF', 'fill-opacity': 0.14 } });
  map.addLayer({ id: 'acc-line', type: 'line', source: 'acc', paint: { 'line-color': '#2F7BFF', 'line-width': 1.5, 'line-opacity': 0.7 } });
  drawAcc();
});

/* ---------- Fleet list ---------- */
function visible() {
  return [...cams.values()]
    .filter((c) => (getOfficerLabel(c.cameraId) + ' ' + (c.grp || '') + ' ' + c.cameraId).toLowerCase().includes(term))
    .filter((c) => filter === 'all' || (filter === 'online' ? c.online : c.recording))
    .filter((c) => region === 'all' || (region === '_none' ? !c.region : c.region === region))
    .sort((a, b) => ({ rec: 0, online: 1, off: 2 }[stateOf(a)] - { rec: 0, online: 1, off: 2 }[stateOf(b)]) || a.cameraId.localeCompare(b.cameraId));
}
let queued = false;
function renderList() {
  if (queued) return;
  queued = true;
  requestAnimationFrame(() => {
    queued = false;
    const rows = visible();
    $('#cnt').textContent = rows.length + (currentLang === 'ar' ? ' معروض' : ' shown');
    $('#q').placeholder = t('searchPlaceholder');
    $('#chipAll').textContent = t('all');
    $('#chipOnline').textContent = t('onlineChip');
    $('#chipRec').textContent = t('recChip');
    $('#secCameras').textContent = t('cameras');
    $('#secWall').textContent = t('liveWall');
    $('#secAlarmTitle').textContent = t('alarmsTitle');
    $('#txtOnline').textContent = t('online');
    $('#txtRec').textContent = t('recording');
    $('#txtReg').textContent = t('registered');
    $('#txtAlarms').textContent = t('openAlarms');

    const pubTabSpan = $('#tabPublic span');
    if (pubTabSpan) pubTabSpan.textContent = t('publicChat');

    // Region tabs: super admin sees every configured region; a company only the regions of its cameras.
    const all = [...cams.values()];
    const names = me.staff ? regionList : [...new Set(all.map((c) => c.region).filter(Boolean))];
    const hasNone = all.some((c) => !c.region);
    const tab = (key, label) => {
      const set = all.filter((c) => key === 'all' || (key === '_none' ? !c.region : c.region === key));
      return `<button class="reg ${region === key ? 'on' : ''}" data-r="${esc(key)}">${esc(label)} <small>${set.filter((c) => c.online).length}/${set.length}</small></button>`;
    };
    $('#regions').innerHTML = tab('all', t('all')) + names.map((n) => tab(n, n)).join('') + (hasNone && names.length ? tab('_none', currentLang === 'ar' ? 'بدون منطقة' : 'No region') : '');

    const card = (c) => {
      const resolved = resolveCameraId(c.cameraId);
      const unreadCount = unreadChats[c.cameraId] || unreadChats[resolved] || 0;
      return `
      <div class="cam ${stateOf(c)} ${selected === c.cameraId ? 'sel' : ''}" data-id="${c.cameraId}" tabindex="0">
        <span class="dot"></span>
        <div class="meta"><b>${esc(getOfficerLabel(c.cameraId))}</b>
          <small>${c.region ? esc(c.region) + ', ' : ''}${c.grp ? esc(c.grp) + ', ' : ''}${c.lat == null ? t('noGps') : c.lat.toFixed(4) + ', ' + c.lng.toFixed(4)}, <span data-ts="${c.ts}">${ago(c.ts)}</span></small></div>

/* ---------- Video wall ---------- */
/* ---------- Remote live view (control room starts a camera's stream, the officer does nothing) ---------- */
function flash(msg) {
  const d = document.createElement('div'); d.className = 'flash-toast'; d.textContent = msg;
  document.body.appendChild(d); setTimeout(() => d.remove(), 3200);
}
// Opening a camera's live view starts its stream if it is online but not recording (the officer does nothing).
function openLive(id) {
  const c = cams.get(id);
  if (c?.online && !c.recording) requestStream(id, 'start'); else watch(id);
}
function requestStream(id, action) {
  socket.emit('remote_stream', { cameraId: id, action });
  if (action === 'start') watch(id);
}
function buildWall() {
  const w = $('#wall'), cols = Math.sqrt(layout);
  w.style.gridTemplateColumns = `repeat(${cols},1fr)`;
  players.forEach((p) => p.destroy()); players.clear();
  slots = slots.slice(0, layout); while (slots.length < layout) slots.push(null);
  w.innerHTML = slots.map((_, i) => `<div class="tile" data-i="${i}"></div>`).join('');
  slots.forEach((_, i) => renderTile(i));
}
function renderTile(i) {
  const t = document.querySelector(`.tile[data-i="${i}"]`), id = slots[i];
  if (players.has(i)) { players.get(i).destroy(); players.delete(i); }
  t.classList.remove('live');
  if (!id) { t.innerHTML = `<div class="empty">${currentLang === 'ar' ? 'خانة فارغة' : 'Empty slot'}<small>${currentLang === 'ar' ? 'اضغط ▶ بجوار الكاميرا لعرضها هنا' : 'Press ▶ next to a camera to show it here'}</small></div>`; return; }
  t.innerHTML = `<video muted autoplay playsinline></video>
    <div class="tag"><span class="nm">${tagOf(id)}</span><span class="pill"></span><button data-s="${i}" aria-label="Toggle sound"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4zM15.5 8.5a5 5 0 010 7M18.5 5.5a9 9 0 010 13"/></svg><span class="lbl">${currentLang === 'ar' ? 'استماع' : 'Listen'}</span></button><button data-f="${i}" aria-label="Toggle fit"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span class="lbl">${currentLang === 'ar' ? 'ملء' : 'Fill'}</span></button><button data-e="${i}" aria-label="Expand" title="Expand"><svg viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg></button><button data-x="${i}" aria-label="Close ${id}"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="wait">${currentLang === 'ar' ? 'في انتظار ' + tagOf(id) + ' لبدء التسجيل…' : 'Waiting for ' + tagOf(id) + ' to start recording…'}<button class="reqbtn" data-r="${id}">${currentLang === 'ar' ? 'بدء البث عن بُعد' : 'Start live view'}</button></div>`;
  start(i, id, t.querySelector('video'));
  applySound(i);
}
const retry = new Map(), lastT = new Map(), startedAt = new Map(), pttHold = new Map();
const waitMsg = (id) => currentLang === 'ar' ? 'في انتظار ' + tagOf(id) + ' لبدء التسجيل…' : 'Waiting for ' + tagOf(id) + ' to start recording…';

function stopTile(i, msg) {
  if (players.has(i)) { try { players.get(i).destroy(); } catch (e) { } players.delete(i); }
  const t = document.querySelector(`.tile[data-i="${i}"]`);
  if (!t) return;
  t.classList.remove('live');
  const w = t.querySelector('.wait');
  if (w && msg) w.innerHTML = msg;
}
// Streams are only playable with a short-lived signature that the server grants to users allowed to see the camera.
function start(i, id, v) {
  if (!flvjs.isSupported()) return;
  if (!cams.get(id)?.recording) { stopTile(i, waitMsg(id)); return; }
  startedAt.set(i, Date.now());
  fetch('/api/stream/' + encodeURIComponent(id))
    .then((r) => (r.ok ? r.json() : Promise.reject()))
    .then(({ sign }) => { if (slots[i] === id && v.isConnected && !players.has(i)) begin(i, id, v, sign); })
    .catch(() => setTimeout(() => {
      const el = document.querySelector(`.tile[data-i="${i}"] video`);
      if (slots[i] === id && el && cams.get(id)?.recording) start(i, id, el);
    }, 3000));
}
function begin(i, id, v, sign) {
  const p = flvjs.createPlayer(
    { type: 'flv', isLive: true, url: `http://${host}:8000/live/${encodeURIComponent(id)}.flv?sign=${sign}` },
    { enableStashBuffer: false, autoCleanupSourceBuffer: true,
      liveBufferLatencyChasing: true, liveBufferLatencyMaxLatency: 1.0, liveBufferLatencyMinRemain: 0.2 });
  p.attachMediaElement(v);
  const again = () => {
    if (players.get(i) !== p) return;
    stopTile(i);
    const n = (retry.get(i) || 0) + 1; retry.set(i, n);
    setTimeout(() => {
      const el = document.querySelector(`.tile[data-i="${i}"] video`);
      if (slots[i] === id && el && cams.get(id)?.recording) start(i, id, el);
    }, Math.min(500 * n, 4000));
  };
  p.on(flvjs.Events.ERROR, again);
  p.on(flvjs.Events.LOADING_COMPLETE, again);
  v.addEventListener('playing', () => { v.parentElement.classList.add('live'); retry.set(i, 0); }, { once: true });
  startedAt.set(i, Date.now());
  players.set(i, p); p.load(); Promise.resolve(p.play()).catch(() => {});
}

function applySound(i) {
  const id = slots[i], t = document.querySelector(`.tile[data-i="${i}"]`);
  if (!id || !t) return;
  const v = t.querySelector('video'), b = t.querySelector('[data-s]');
  const open = !!t.dataset.listen || !!cams.get(id)?.ptt || pttHold.has(id);
  t.classList.toggle('talking', !!cams.get(id)?.ptt);
  if (v) { v.muted = !open; if (open) Promise.resolve(v.play()).catch(() => {}); }
  if (b) { b.classList.toggle('on', open); b.querySelector('.lbl').textContent = open ? (currentLang === 'ar' ? 'كتم' : 'Mute') : (currentLang === 'ar' ? 'استماع' : 'Listen'); }
}
const applySoundFor = (id) => slots.forEach((s, i) => { if (s === id) applySound(i); });

setInterval(() => {
  slots.forEach((id, i) => {
    if (!id || !cams.get(id)?.recording || !players.has(i)) return;
    const v = document.querySelector(`.tile[data-i="${i}"] video`); if (!v) return;
    const live = v.parentElement.classList.contains('live');
    if (!live && Date.now() - (startedAt.get(i) || 0) > 8000) { lastT.delete(i); return renderTile(i); }
    if (live && lastT.get(i) === v.currentTime) { lastT.delete(i); return renderTile(i); }
    lastT.set(i, v.currentTime);
  });
}, 4000);

function watch(id) {
  if (slots.includes(id)) return;
  let i = slots.indexOf(null); if (i < 0) i = slots.length - 1;
  slots[i] = id; renderTile(i);
}

}

}

/* ---------- Chat System Logic ---------- */
let activeChatType = 'PUBLIC';
let activeChatTarget = 'ALL';
const chatMessagesHistory = [];
const unreadChats = { PUBLIC: 0 };

$('#tabPublic').onclick = () => {
  activateTab($('#tabPublic'));
};

function renderChatMessages() {
  const container = $('#chat-msgs');
  const filtered = chatMessagesHistory.filter(m => {
    if (activeChatType === 'PUBLIC') return m.chatType === 'PUBLIC';
    if (activeChatType === 'PRIVATE') {
      const target = resolveCameraId(activeChatTarget);
      const matchTarget = (id) => {
        const resId = resolveCameraId(id);
        return resId === target || resId.startsWith(target) || target.startsWith(resId);
      };
      return m.chatType === 'PRIVATE' && (matchTarget(m.targetId) || matchTarget(m.senderId));
    }
    return true;
  });

  container.innerHTML = filtered.map(m => {
    let contentHtml = esc(m.message);
    if (m.audio) {
      const vid = voiceId(m);
      contentHtml = `
        <div class="voice-msg" data-vid="${vid}">
          <button class="voice-play-btn" data-vid="${vid}">▶</button>
          <div class="voice-wave" data-vid="${vid}">${waveBars(vid)}</div>
          <span class="voice-duration">0:00</span>
        </div>
      `;
    }
    return `
      <div class="chat-msg ${m.mine ? 'mine' : 'other'}">
        <b>${esc(m.senderName)}</b>
        ${contentHtml}
      </div>
    `;
  }).join('');
  container.scrollTop = container.scrollHeight;
  Object.keys(voiceAudio).forEach(updateVoiceUI);
}

$('#chatSend').onclick = () => {
  const input = $('#chatInput');
  const text = input.value.trim();
  if (!text) return;

  const target = activeChatType === 'PUBLIC' ? 'ALL' : resolveCameraId(activeChatTarget);

  if (activeChatType === 'PRIVATE' && (!target || target === 'ALL')) {
    alert(t('selectCameraFirst'));
    return;
  }

  socket.emit('send_message', {
    chatType: activeChatType,
    targetId: target,
    message: text
  });

  chatMessagesHistory.push({
    chatType: activeChatType,
    targetId: target,
    senderId: 'admin',
    senderName: currentLang === 'ar' ? 'غرفة التحكم (أنت)' : 'Control Room (You)',
    message: text,
    timestamp: Date.now(),
    mine: true
  });

  input.value = '';
  renderChatMessages();
};

$('#chatInput').onkeydown = (e) => {
  if (e.key === 'Enter') $('#chatSend').click();
};

/* ---------- Voice Recording Logic (Dashboard) ---------- */
let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;

document.addEventListener('DOMContentLoaded', () => {
  const micBtn = $('#micBtn');
  if (micBtn) {
    micBtn.onclick = async () => {
      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];

          mediaRecorder.ondataavailable = (event) => {
            if (event.data.size > 0) audioChunks.push(event.data);
          };

          mediaRecorder.onstop = () => {
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            const reader = new FileReader();
            reader.readAsDataURL(audioBlob);
            reader.onloadend = () => {
              const base64Audio = reader.result;
              
              const target = activeChatType === 'PUBLIC' ? 'ALL' : resolveCameraId(activeChatTarget);
              if (activeChatType === 'PRIVATE' && (!target || target === 'ALL')) {
                alert(t('selectCameraFirst'));
                return;
              }

              socket.emit('send_message', {
                chatType: activeChatType,
                targetId: target,
                message: '[Voice Note]',
                audio: base64Audio
              });

              chatMessagesHistory.push({
                chatType: activeChatType,
                targetId: target,
                senderId: 'admin',
                senderName: currentLang === 'ar' ? 'غرفة التحكم (أنت)' : 'Control Room (You)',
                message: '[Voice Note]',
                audio: base64Audio,
                timestamp: Date.now(),
                mine: true
              });
              renderChatMessages();
            };

            stream.getTracks().forEach(track => track.stop());
          };

          mediaRecorder.start();
          isRecording = true;
          micBtn.classList.add('recording');
        } catch (err) {
          alert('Microphone access denied or not supported.');
        }
      } else {
        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
          mediaRecorder.stop();
        }
        isRecording = false;
        micBtn.classList.remove('recording');
      }
    };
  }
});

/* ---------- Live data ---------- */
function pttChanged(c) {
  const id = c.cameraId;
  if (c.ptt) { clearTimeout(pttHold.get(id)); pttHold.delete(id); watch(id); }
  else pttHold.set(id, setTimeout(() => { pttHold.delete(id); applySoundFor(id); }, 3000));
  applySoundFor(id);
}
function upsert(c) {
  const prev = cams.get(c.cameraId);
  const wasRec = !!prev?.recording, wasPtt = !!prev?.ptt;
  cams.set(c.cameraId, c);
  syncMarker(c);
  if (c.recording && !wasRec) {
    if (slots.includes(c.cameraId)) {
      slots.forEach((id, i) => {
        if (id === c.cameraId) setTimeout(() => { if (slots[i] === id && cams.get(id)?.recording) renderTile(i); }, 600);
      });
    } else watch(c.cameraId);
  }
  if (!c.recording && wasRec) slots.forEach((id, i) => { if (id === c.cameraId) stopTile(i, waitMsg(id)); });
  if (!!c.ptt !== wasPtt) pttChanged(c);
  if (follow && selected === c.cameraId && c.lat != null) map.easeTo({ center: [c.lng, c.lat] });
  if (selected === c.cameraId) { renderInfo(); drawAcc(); }
  renderList();
}

const socket = io();

socket.on('connect', () => {
  socket.emit('register', { id: 'admin', type: 'admin' });
});

socket.on('dashboard_snapshot', (s) => { s.cams.forEach(upsert); alarms = s.alarms; renderAlarms(); });
socket.on('dashboard_cam', upsert);
socket.on('dashboard_alarm_ack', ({ id }) => { const a = alarms.find((x) => x.id === id); if (a) { a.ack = true; renderAlarms(); } });
socket.on('dashboard_cam_removed', ({ cameraId }) => {
  cams.delete(cameraId);
  markers.get(cameraId)?.remove(); markers.delete(cameraId);
  slots.forEach((id, i) => { if (id === cameraId) { slots[i] = null; renderTile(i); } });
  if (selected === cameraId) { selected = null; renderInfo(); }
  renderList();
});
socket.on('remote_stream_result', (r) => {
  if (!r.ok) flash(currentLang === 'ar' ? 'الكاميرا غير متصلة' : 'Camera is offline');
});
socket.on('connect_error', (e) => { if (e.message === 'unauthorized') location.href = '/login.html'; });
socket.on('dashboard_sos', (a) => {
  alarms.unshift(a); renderAlarms(); beep();
  const h = $('#top'); h.classList.remove('flash'); void h.offsetWidth; h.classList.add('flash');
  select(a.cameraId, true); watch(a.cameraId);
});

socket.on('receive_message', (d) => {
  const senderRaw = String(d.senderId || d.senderName || d.targetId || '');
  const isOurMessage = (
    senderRaw === 'admin' || 
    senderRaw === socket.id || 
    senderRaw === 'ADMIN' || 
    senderRaw.includes('Control Room') || 
    d.mine === true
  );

  if (isOurMessage) return;

  const isPublic = (d.chatType === 'PUBLIC');
  let rawCamId = isPublic ? d.senderId : (d.senderId === 'admin' ? d.targetId : d.senderId);
  let resolvedCamId = resolveCameraId(rawCamId);

  if (!resolvedCamId || resolvedCamId === 'admin' || resolvedCamId === 'ADMIN' || resolvedCamId === 'UNKNOWN') {
    resolvedCamId = resolveCameraId(d.targetId);
  }

  const officerName = getOfficerLabel(resolvedCamId);

  chatMessagesHistory.push({
    chatType: d.chatType || 'PUBLIC',
    targetId: isPublic ? 'ALL' : resolvedCamId,
    senderId: resolvedCamId,
    senderName: officerName,
    message: d.message,
    audio: d.audio, // تم إضافة حفظ الصوت القادم من الكاميرا هنا بنجاح!
    timestamp: d.timestamp || Date.now(),
    mine: false
  });

  playMessageBeep();

  if (!isPublic && resolvedCamId && resolvedCamId !== 'UNKNOWN' && resolvedCamId !== 'admin') {
    openPrivateTab(resolvedCamId, false);
  }

  const targetKey = isPublic ? 'PUBLIC' : resolvedCamId;
  const isActive = (isPublic && activeChatType === 'PUBLIC') || (!isPublic && activeChatType === 'PRIVATE' && resolveCameraId(activeChatTarget) === resolvedCamId);

  if (!isActive && targetKey && targetKey !== 'UNKNOWN') {
    unreadChats[targetKey] = (unreadChats[targetKey] || 0) + 1;
  }

  updateTabBadges();
  renderList();
  renderChatMessages();
});

setInterval(() => {
  $('#clock').textContent = new Date().toLocaleString([], { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', second: '2-digit' });
  document.querySelectorAll('[data-ts]').forEach((el) => { el.textContent = ago(+el.dataset.ts); });
}, 1000);

function updateUserDisplay() {
  if (!currentUser) return;
  $('#out').textContent = t('signOut');
  const ishebAdmin = currentUser.role === 'admin' || (currentUser.name && currentUser.name.toLowerCase() === 'administrator');
  $('#who').textContent = currentUser.company ? currentUser.company + ' · ' + currentUser.name : (ishebAdmin ? t('adminRole') : currentUser.name);
  $('#adminLink').style.display = currentUser.super ? '' : 'none';
}

function loadDirectory() {
  fetch('/api/regions').then((r) => r.json()).then((l) => { regionList = l; renderList(); }).catch(() => { });
  if (me.super) fetch('/api/admin/companies').then((r) => r.json()).then((d) => { companyList = d.companies; }).catch(() => { });
}
fetch('/api/me').then((r) => (r.ok ? r.json() : Promise.reject()))
  .then((u) => { 
    me = u; 
    currentUser = u;
    updateUserDisplay();
    loadDirectory();
    renderInfo(); 
  })
  .catch(() => { location.href = '/login.html'; });

$('#out').onclick = () => fetch('/api/logout', { method: 'POST' }).then(() => { location.href = '/login.html'; });

const unlockAudio = () => { const b = $('#snd'); if (b) b.remove(); };
if (navigator.userActivation?.hasBeenActive) unlockAudio();
else { addEventListener('pointerdown', unlockAudio, { once: true, capture: true }); addEventListener('keydown', unlockAudio, { once: true, capture: true }); }

buildWall(); renderList(); renderAlarms();

$('#langToggle').addEventListener('click', (e) => {
  const btn = e.target.closest('.lang-btn');
  if (!btn || btn.classList.contains('active')) return;
  
  currentLang = btn.dataset.l;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b === btn));
  document.body.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
  
  renderList();
  renderAlarms();
  renderInfo();
  buildWall();
  updateUserDisplay();
});

/* ---------- Voice note playback ---------- */
var voiceAudio = {};   // vid -> { el, src }
var voiceSeq = 0;
function waveBars(vid) {
  let h = 0; for (const ch of vid) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  let out = '';
  for (let k = 0; k < 32; k++) { h = (h * 1664525 + 1013904223) >>> 0; out += `<i style="height:${6 + (h >>> 24) % 20}px"></i>`; }
  return out;
}
function voiceId(m) { return m._vid || (m._vid = 'v' + (++voiceSeq)); }
const fmtDur = (t) => (isFinite(t) && t > 0) ? Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0') : '0:00';

function updateVoiceUI(vid) {
  const v = voiceAudio[vid];
  if (!v) return;
  const a = v.el;
  document.querySelectorAll(`.voice-msg[data-vid="${vid}"]`).forEach(box => {
    box.querySelector('.voice-play-btn').textContent = a.paused ? '▶' : '⏸';
    const dur = isFinite(a.duration) ? a.duration : 0;
    const bars = box.querySelectorAll('.voice-wave i'), n = dur ? Math.round(a.currentTime / dur * bars.length) : 0;
    bars.forEach((x, k) => x.classList.toggle('on', k < n));
    box.querySelector('.voice-duration').textContent = fmtDur(a.paused && a.currentTime === 0 ? dur : a.currentTime);
  });
}

function getVoice(vid) {
  if (voiceAudio[vid]) return voiceAudio[vid];
  const m = chatMessagesHistory.find(x => x._vid === vid);
  if (!m || !m.audio) return null;
  const el = new Audio(m.audio);
  el.preload = 'metadata';
  const upd = () => updateVoiceUI(vid);
  ['timeupdate', 'play', 'pause', 'ended', 'loadedmetadata', 'durationchange'].forEach(ev => el.addEventListener(ev, upd));
  // MediaRecorder webm has no length header: seek far to make the browser compute it
  el.addEventListener('loadedmetadata', () => {
    if (el.duration === Infinity) {
      el.currentTime = 1e101;
      el.addEventListener('timeupdate', function fix() { el.removeEventListener('timeupdate', fix); el.currentTime = 0; });
    }
  });
  el.addEventListener('ended', () => { el.currentTime = 0; upd(); });
  return (voiceAudio[vid] = { el });
}

$('#chat-msgs').addEventListener('click', (e) => {
  const btn = e.target.closest('.voice-play-btn');
  const wave = e.target.closest('.voice-wave');
  const vid = (btn || wave)?.dataset.vid;
  if (!vid) return;
  const v = getVoice(vid);
  if (!v) return;
  if (wave && !btn && isFinite(v.el.duration)) {
    const r = wave.getBoundingClientRect();
    v.el.currentTime = v.el.duration * Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    updateVoiceUI(vid);
    return;
  }
  Object.entries(voiceAudio).forEach(([id, o]) => { if (id !== vid && !o.el.paused) o.el.pause(); });
  if (v.el.paused) v.el.play().catch(err => console.error('Voice note playback failed:', err));
  else v.el.pause();
});
