<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="ad.pageTitle">Admin panel - VisionGuard</title>
<link rel="icon" type="image/png" href="/brand/favicon.png">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
<script src="/i18n.js"></script>
<script src="/i18n/admin.js"></script>
<script src="/i18n/employees.js"></script>
<script src="/i18n/features.js"></script>
<link rel="stylesheet" href="/portal.css">
<style>
.layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:1000px){.layout{grid-template-columns:1fr}}
.stack{display:grid;gap:18px}
.rgchip{display:inline-flex;align-items:center;gap:8px;padding-block:5px;padding-inline:13px 6px;border-radius:99px;font-size:13px;font-weight:600;background:var(--raise);border:1px solid var(--line)}
.rgchip button{border:0;background:none;color:var(--mut);cursor:pointer;width:22px;height:22px;border-radius:50%}
.rgchip button:hover{background:var(--rec);color:#fff}
.newco{display:flex;gap:10px;flex-wrap:wrap}
.newco input{flex:1;min-width:200px}
.co{margin-top:10px;padding:12px 16px;border-radius:14px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow-sm)}
.co-body{display:none;margin-top:12px;padding-top:6px;border-top:1px solid var(--line-soft)}.co.open .co-body{display:block}
.chev{font-style:normal;color:var(--mut);transition:transform .15s;width:14px}.co.open .chev{transform:rotate(90deg)}
.co-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.co-head .logo{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:#fff;background:linear-gradient(135deg,var(--brand),var(--blue));box-shadow:0 4px 14px rgba(94,74,158,.4);flex:none}
.co-head h2{margin:0;font-size:18px}
.co-head .meta{color:var(--mut);font-size:12.5px}
.co-head .sp{margin-inline-start:auto}
.sub{margin:16px 0 8px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.9px;color:var(--mut)}
.users{display:grid;gap:8px}
.user{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:11px;background:var(--raise);border:1px solid var(--line-soft)}
.user .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--sel),#ff8a00);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:var(--sel-ink);flex:none}
.user b{font-size:14px}.user small{color:var(--mut);display:block;font-size:12px}
.user .sp{margin-inline-start:auto;display:flex;gap:6px}
.subbox{display:flex;gap:8px;align-items:center}.chip-s{padding:4px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--raise);border:1px solid var(--line)}.chip-s.expiring{background:color-mix(in srgb,var(--sel) 22%,var(--panel))}.chip-s.locked{background:var(--rec);color:#fff;border-color:transparent}.chip-s.expired{background:color-mix(in srgb,var(--rec) 22%,var(--panel))}.chip-s.active{background:color-mix(in srgb,var(--ok) 16%,var(--panel))}
.adduser{display:grid;grid-template-columns:1fr 1fr 1.2fr auto auto;gap:8px;margin-top:10px}
.adduser .pw{display:flex;gap:6px}.adduser .pw input{flex:1;min-width:0}
@media (max-width:760px){.adduser{grid-template-columns:1fr}}
.emp-tag{display:inline-block;margin-inline-start:8px;padding:1px 8px;border-radius:99px;font-size:11px;font-weight:800;background:color-mix(in srgb,var(--blue) 14%,var(--panel));color:var(--blue);vertical-align:middle}
.emp-tag.on{background:color-mix(in srgb,var(--ok) 16%,var(--panel));color:var(--ok)}
.emp-tag.off{background:color-mix(in srgb,var(--rec) 14%,var(--panel));color:var(--rec)}
.user.is-off{opacity:.6}
.addemp{display:grid;grid-template-columns:1.3fr .8fr 1fr auto;gap:8px;margin-top:10px}
@media (max-width:760px){.addemp{grid-template-columns:1fr}}
details.bulk{margin-top:10px;border:1px solid var(--line-soft);border-radius:12px;background:var(--raise);padding:10px 14px}
details.bulk summary{cursor:pointer;font-weight:700;font-size:13.5px}
details.bulk textarea{width:100%;min-height:110px;margin-top:10px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:13.5px/1.5 ui-monospace,Menlo,Consolas,monospace}
details.bulk p{margin:8px 0 0;color:var(--mut);font-size:12.5px;line-height:1.5}
.credbox{margin-top:12px;padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--ok) 10%,var(--panel));border:1px solid color-mix(in srgb,var(--ok) 45%,var(--line))}
.credbox table td{padding:5px 8px;font-size:13px;font-family:Consolas,monospace}
.credbox .head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.cam{padding:5px 12px;border-radius:99px;font-size:12.5px;font-weight:600;background:color-mix(in srgb,var(--blue) 12%,var(--panel));border:1px solid color-mix(in srgb,var(--blue) 35%,var(--line))}
.cred{margin-top:12px;padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--ok) 12%,var(--panel));border:1px solid color-mix(in srgb,var(--ok) 45%,var(--line));font-size:13.5px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.cred code{font-family:Consolas,monospace;font-size:13.5px;background:var(--panel);padding:3px 8px;border-radius:7px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse}
td{padding:10px 6px;border-bottom:1px solid var(--line-soft);font-size:14px}
tr:last-child td{border-bottom:0}
td select{width:100%}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:8px;background:var(--off)}
.dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.empty{color:var(--mut);font-size:13.5px;padding:14px 0}
.fgroup{margin-top:10px}.fgroup>h4{margin:0 0 6px;font-size:11.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--mut)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.fopt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:11px;background:var(--raise);border:1px solid var(--line-soft);cursor:pointer;transition:border-color .12s,background .12s}
.fopt:hover{border-color:var(--line)}
.fopt input{width:17px;height:17px;margin-top:2px;accent-color:var(--brand);flex:none;cursor:pointer}
.fopt b{display:block;font-size:13.5px}.fopt small{display:block;color:var(--mut);font-size:12px;line-height:1.35;margin-top:1px}
.fopt.on{border-color:color-mix(in srgb,var(--brand) 55%,var(--line));background:color-mix(in srgb,var(--brand) 7%,var(--raise))}
.fopt.dim{opacity:.5;cursor:not-allowed}
.kind{margin:16px 0 0;font-size:13px;font-weight:800;color:var(--text);padding-bottom:4px;border-bottom:1px solid var(--line-soft)}
.co-head .logo.has{background:var(--panel);border:1px solid var(--line);box-shadow:none}.co-head .logo .avimg{object-fit:contain;padding:3px}
.uw{display:grid;gap:6px}.uacc{display:none;padding:2px 14px 14px;border-radius:11px;background:var(--panel);border:1px solid var(--line-soft)}.uw.open .uacc{display:block}
.piccell{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:6px}
.fbar{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.fcount{font-size:12.5px;color:var(--mut)}
</style>
<link rel="stylesheet" href="/i18n.css">
</head>
<body>
<header id="top"></header>
<main>
  <section class="card" style="margin-bottom:18px" id="newCompany">
    <h3 data-i18n="ad.newCo">Add a new company</h3>
    <div class="newco">
      <input id="coName" placeholder="New company name, e.g. Al Rajhi Security" data-i18n-ph="ad.phCo" maxlength="60">
      <select id="coPkg" aria-label="Package" data-i18n-aria="ad.pkgAria"></select>
      <button class="btn pri" id="coAdd" data-i18n="ad.addCo">Add company</button>
    </div>
    <div class="newco" style="margin-top:10px"><input id="coAdmin" dir="ltr" placeholder="Administrator username (the company's own login, e.g. alnoor.admin)" data-i18n-ph="ad.phCoAdmin" maxlength="32" autocomplete="off">
      <span class="muted" style="font-size:12.5px;align-self:center;flex:2;min-width:220px" data-i18n="ad.coAdminNote">Leave empty to add the administrator later. A strong password is made for you and shown once.</span></div>
    <details class="bulk" style="margin-top:12px"><summary><span data-i18n="ad.chooseCo">Choose what this company can use</span> <span class="muted" style="font-weight:500" data-i18n="ad.allDefault">(all selected by default)</span></summary><div id="newFeat"></div></details>
  </section>
  <div class="layout">
    <section class="card">
      <h3><span data-i18n="ad.companies">Companies</span> <span class="muted" id="coCount" style="text-transform:none;letter-spacing:0;font-weight:500"></span></h3>
      <div style="display:flex;gap:8px;margin-bottom:6px"><button class="btn sm" id="openAll" data-i18n="ad.openAll">Open all</button><button class="btn sm" id="closeAll" data-i18n="ad.closeAll">Close all</button></div>
      <div id="companies"></div>
    </section>

    <div class="stack">
    <section class="card">
      <h3 data-i18n="ad.regions">Regions</h3>
      <div class="newco">
        <input id="rgName" placeholder="New region, e.g. Medina" data-i18n-ph="ad.phRegion" maxlength="40">
        <button class="btn pri" id="rgAdd" data-i18n="ad.add">Add</button>
      </div>
      <div class="chips" id="regions" style="margin-top:12px"></div>
    </section>

    <section class="card">
      <h3 data-i18n="ad.camAssign">Camera assignment</h3>
      <p class="muted" style="margin:0 0 10px;font-size:13px" data-i18n="ad.camAssignNote">Choose which company owns each camera. That company's users see only their cameras.</p>
      <div style="margin-bottom:10px"><button class="btn sm danger" id="rmOffline" data-i18n="ad.rmOffline">Remove all offline cameras</button></div>
      <div class="newco" style="margin-bottom:12px">
        <input id="newCamId" dir="ltr" placeholder="New camera ID, e.g. BWC-08-RIY" data-i18n-ph="ad.phCam" maxlength="32">
        <button class="btn pri" id="newCamBtn" data-i18n="ad.createTok">Create + issue token</button>
      </div>
      <table><tbody id="cams"></tbody></table>
    </section>
    </div>
  </div>
</main>

<script src="/portal.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const t = VG.t, th = VG.h;
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ltr = (s) => `<span class="ltr">${s}</span>`;
let data = { companies: [], cameras: [] };
const lastCred = {};   // companyId -> { username, password } shown once after creating a user
const lastEmp = {};    // companyId -> [{ name, employeeNo, username, password }] shown once after creating employees

const api = (method, url, body) => fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: body === undefined ? undefined : JSON.stringify(body) })
  .then(async (r) => { const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || t('common.failed')); return j; });
const load = () => api('GET', '/api/admin/companies').then((d) => { data = d; render(); });
const fail = (e) => toast(e.message);
const genPw = () => { const c = 'abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'; return Array.from(crypto.getRandomValues(new Uint8Array(12)), (x) => c[x % c.length]).join(''); };
const ROLE = (r) => (VG.has('em.role.' + r) ? t('em.role.' + r) : r);
const fl = (f) => (VG.has('ft.' + f.key + '.l') ? t('ft.' + f.key + '.l') : f.label), fh = (f) => (VG.has('ft.' + f.key + '.h') ? t('ft.' + f.key + '.h') : f.hint), fg = (g) => (VG.has('ft.g.' + g) ? t('ft.g.' + g) : g);   // the catalogue comes from the server in English; the words are looked up by key
const day = (ts) => VG.iso(ts);

const pkgOptions = (sel) => `<option value="">${t('ad.unlimitedLegacy')}</option>` + (data.packages || []).map((p) =>
  `<option value="${p.maxCameras}" ${sel === p.maxCameras ? 'selected' : ''}>${esc(t('ad.pkg', { cams: t('common.nCameras', { n: p.maxCameras }), live: p.maxLive }))}</option>`).join('');

// Feature checkboxes, grouped. sel = what is ticked, avail = what may be ticked at all (a user cannot get what the company does not have).
function featBoxes(sel, avail, attr, kinds = ['feature']) {
  const all = data.catalog || [], opt = (f) => {
    const on = sel.includes(f.key), ok = avail.includes(f.key);
    return `<label class="fopt ${on ? 'on' : ''} ${ok ? '' : 'dim'}" title="${ok ? '' : esc(t('ad.notInCo'))}"><input type="checkbox" ${attr}="${f.key}" ${on ? 'checked' : ''} ${ok ? '' : 'disabled'}><span><b>${esc(fl(f))}</b><small>${esc(fh(f))}</small></span></label>`;
  };
  return kinds.map((k) => {
    const cat = all.filter((f) => (f.kind || 'feature') === k), groups = [...new Set(cat.map((f) => f.group))];
    return (kinds.length > 1 ? `<div class="kind">${k === 'feature' ? t('ad.canSee') : t('ad.canDo')}</div>` : '') + groups.map((g) => `<div class="fgroup"><h4>${esc(fg(g))}</h4><div class="fgrid">${cat.filter((f) => f.group === g).map(opt).join('')}</div></div>`).join('');
  }).join('');
}
// Ticking something that needs another one (Live wall needs Live dashboard) ticks that one too; unticking it unticks them.
function fixNeeds(box, attr, changed) {
  const cat = data.catalog || [], on = (k) => box.querySelector(`[${attr}="${k}"]`);
  const cb = on(changed.dataset[attr.replace('data-', '')]); if (!cb) return;
  const f = cat.find((x) => x.key === cb.getAttribute(attr));
  if (cb.checked) (f.needs || []).forEach((n) => { const x = on(n); if (x && !x.disabled) x.checked = true; });
  else cat.filter((x) => (x.needs || []).includes(f.key)).forEach((x) => { const y = on(x.key); if (y) y.checked = false; });
}
const ticked = (box, attr) => [...box.querySelectorAll(`[${attr}]:checked`)].map((c) => c.getAttribute(attr));
const openCo = new Set(), openU = new Set();   // companies that are expanded (the rest are collapsed into one line each)
const nFeat = () => (data.catalog || []).filter((f) => (f.kind || 'feature') === 'feature').length;
function subChip(co) {
  const s = co.subscription; if (!s) return t('ad.sub.none');
  return s.state === 'locked' ? t('ad.sub.locked', { date: day(s.lockOn) }) : s.daysLeft < 0 ? t('ad.sub.ended', { date: day(co.subEnd) }) : t('ad.sub.until', { date: day(co.subEnd), n: s.daysLeft });
}
function render() {
  $('#coCount').textContent = data.companies.length ? `· ${data.companies.length}` : '';
  $('#coPkg').innerHTML = pkgOptions(20).replace(t('ad.unlimitedLegacy'), t('ad.unlimited'));
  if (!$('#newFeat').children.length) { const all = (data.catalog || []).filter((f) => f.kind === 'feature').map((f) => f.key); $('#newFeat').innerHTML = featBoxes(all, all, 'data-nf'); }
  const byCo = (id) => data.cameras.filter((c) => c.companyId === id);
  $('#companies').innerHTML = data.companies.length ? data.companies.map((co) => {
    const nUsers = co.users.filter((u) => u.role !== 'officer').length, nEmps = co.users.length - nUsers, nCams = byCo(co.id).length;
    return `
    <div class="co ${openCo.has(co.id) ? 'open' : ''}" data-id="${co.id}">
      <div class="co-head" data-act="toggle" style="cursor:pointer">
        <i class="chev flip">▸</i><div class="logo ${co.logoTs ? 'has' : ''}">${avatarInner('company', co.id, co.logoTs, co.name[0].toUpperCase())}</div>
        <div><h2>${esc(co.name)}</h2><div class="meta">${esc(t('common.nUsers', { n: nUsers }))} · ${esc(t('ad.nEmployees', { n: nEmps }))} · ${co.maxCameras ? esc(t('ad.camsOf', { frac: nCams + ' / ' + co.maxCameras })) : esc(t('common.nCameras', { n: nCams }))}${co.maxLive ? esc(t('ad.live', { frac: co.liveNow + ' / ' + co.maxLive })) : ''}</div></div>
        <select class="pkg" data-act="pkg" aria-label="${esc(t('ad.pkgAria'))}">${pkgOptions(co.maxCameras)}</select>
        <span class="subbox" title="${esc(t('ad.sub.title'))}"><span class="chip-s ${co.subscription ? co.subscription.state : 'none'}">${esc(subChip(co))}</span>
          <select class="subsel" data-act="sub" aria-label="${esc(t('ad.sub.aria'))}"><option value="">${t('ad.sub.extend')}</option>${['1', '3', '6', '12', '24', '36'].map((k) => `<option value="${k}">${t('ad.sub.' + k)}</option>`).join('')}<option value="date">${t('ad.sub.date')}</option><option value="clear">${t('ad.sub.clear')}</option></select></span>
        <button class="btn sm danger sp" data-act="delco">${t('ad.delCo')}</button>
      </div>
      <div class="co-body">
      <div class="sub">${t('em.logo')}</div>
      <div class="piccell"><div class="logo ${co.logoTs ? 'has' : ''}" style="width:54px;height:54px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;color:#fff;background:linear-gradient(135deg,var(--brand),var(--blue));overflow:hidden">${avatarInner('company', co.id, co.logoTs, co.name[0].toUpperCase())}</div>
        <button class="btn sm" data-act="logo">${co.logoTs ? t('em.change') : t('em.upload')}</button>${co.logoTs ? `<button class="btn sm" data-act="logorm">${t('em.remove')}</button>` : ''}<span class="muted" style="font-size:12.5px">${t('ad.logoNote')}</span></div>
      <div class="sub">${t('ad.canUse')} <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:500">${t('ad.alwaysOn')}</span></div>
      <div class="feat" data-feat="${co.id}">${featBoxes(co.features, (data.catalog || []).map((f) => f.key), 'data-f')}
        <div class="fbar"><span class="fcount">${esc(t('em.selected', { n: co.features.length, total: nFeat() }))}</span><button class="btn sm" data-act="fall">${t('em.selectAll')}</button><button class="btn sm" data-act="fnone">${t('em.clear')}</button><button class="btn sm pri" data-act="fsave">${t('ad.saveFeat')}</button></div></div>
      <div class="sub">${t('ad.assigned')}</div>
      <div class="chips">${byCo(co.id).map((c) => `<span class="cam">${esc(c.id)}</span>`).join('') || `<span class="muted" style="font-size:13px">${t('ad.noneYet')}</span>`}</div>

      ${co.users.some((u) => u.role === 'manager') ? '' : `<div class="cred" style="margin-top:14px">${t('ad.noAdmin')}<button class="btn pri sm" data-act="mkadmin">${t('ad.mkAdmin')}</button></div>`}
      <div class="sub">${t('ad.dashUsers')} <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:500">${t('ad.dashUsersNote')}</span></div>
      <div class="users">${co.users.filter((u) => u.role !== 'officer').map((u) => `
        <div class="uw ${openU.has(u.id) ? 'open' : ''}" data-uid="${u.id}"><div class="user" data-uid="${u.id}"><div class="av">${avatarInner('user', u.id, u.avatarTs, u.username[0].toUpperCase())}</div>
          <div><b>${esc(u.username)}</b><small>${esc(u.name)} · ${ROLE(u.role)}</small></div>
          <div class="sp"><button class="btn sm" data-act="upic">${t('em.photo')}</button><button class="btn sm" data-act="uacc">${esc(t('ad.accessOn', { what: u.role === 'manager' ? t('em.accessFull') : t('ad.on', { n: u.access.filter((k) => co.features.includes(k) || (data.catalog.find((f) => f.key === k) || {}).kind === 'action').length }) }))}</button><button class="btn sm" data-act="pw">${t('em.reset')}</button><button class="btn sm danger" data-act="deluser">${t('em.remove')}</button></div></div>
          <div class="uacc">${u.role === 'manager' ? `<div class="muted" style="padding-top:12px;font-size:13px">${t('ad.adminFull')}</div>`
            : `<div data-ubox>${featBoxes(u.access, [...co.features, ...data.catalog.filter((f) => f.kind === 'action').map((f) => f.key)], 'data-up', ['feature', 'action'])}<div class="fbar"><span class="fcount">${esc(t('ad.nSelected', { n: u.access.length }))}</span><button class="btn sm" data-act="uall">${t('em.selectAll')}</button><button class="btn sm" data-act="unone">${t('em.clear')}</button><button class="btn sm pri" data-act="usave">${t('em.saveAccess')}</button></div></div>`}</div></div>`).join('') || `<div class="empty">${t('em.noUsers')}</div>`}</div>
      ${lastCred[co.id] ? `<div class="cred">${t('ad.loginFor')} <code>${esc(lastCred[co.id].username)}</code> <code>${esc(lastCred[co.id].password)}</code>
        <button class="btn sm" data-act="copy">${t('em.copy')}</button><span class="muted" style="font-size:12px">${t('ad.saveIt')}</span></div>` : ''}
      <div class="adduser">
        <input class="nu" dir="ltr" placeholder="Username" data-i18n-ph="em.phUser" maxlength="32" autocomplete="off">
        <input class="nn" placeholder="${esc(t('ad.phDisplay'))}" maxlength="60">
        <div class="pw"><input class="np" dir="ltr" placeholder="${esc(t('em.phPass'))}" autocomplete="new-password"><button class="btn sm" data-act="gen" type="button">${t('ad.generate')}</button></div>
        <select class="nr" aria-label="${esc(t('ad.roleAria'))}" title="${esc(t('ad.roleTitle'))}"><option value="manager">${ROLE('manager')}</option><option value="client" selected>${ROLE('client')}</option><option value="viewer">${t('ad.viewerRO')}</option></select>
        <button class="btn pri" data-act="adduser">${t('em.addUser')}</button>
      </div>

      <div class="sub">${t('ad.employees')} <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:500">${t('ad.employeesNote')}</span></div>
      <div class="users">${co.users.filter((u) => u.role === 'officer').map((u) => `
        <div class="user ${u.active ? '' : 'is-off'}" data-uid="${u.id}"><div class="av">${avatarInner('user', u.id, u.avatarTs, (u.name || u.username)[0].toUpperCase())}</div>
          <div><b>${esc(u.name)}${u.holding ? `<span class="emp-tag on">${esc(t('em.has', { camera: u.holding }))}</span>` : ''}${u.active ? '' : `<span class="emp-tag off">${t('em.off')}</span>`}</b><small>${u.employeeNo ? esc(t('em.no', { n: u.employeeNo })) + (u.username !== u.employeeNo ? ' · ' + esc(u.username) : '') : esc(u.username)}</small></div>
          <div class="sp"><button class="btn sm" data-act="upic">${t('em.photo')}</button><button class="btn sm" data-act="editemp">${t('em.edit')}</button><button class="btn sm" data-act="pw">${t('em.reset')}</button><button class="btn sm" data-act="toggleemp">${u.active ? t('em.switchOff') : t('em.switchOn')}</button><button class="btn sm danger" data-act="deluser">${t('em.remove')}</button></div></div>`).join('') || `<div class="empty">${t('em.noEmps')}</div>`}</div>
      ${(lastEmp[co.id] || []).length ? `<div class="credbox"><div class="head"><b>${esc(t('em.logins', { n: lastEmp[co.id].length }))}</b><span class="muted">${t('em.shownOnce')}</span>
        <button class="btn sm" data-act="copyemp">${t('em.copy')}</button><button class="btn sm" data-act="csvemp">${t('em.csv')}</button></div>
        <table class="ltr">${lastEmp[co.id].map((c) => `<tr><td>${esc(c.name)}</td><td>${esc(c.employeeNo || '')}</td><td>${esc(c.username)}</td><td>${esc(c.password)}</td></tr>`).join('')}</table></div>` : ''}
      <div class="addemp">
        <input class="en" placeholder="${esc(t('em.phEmp'))}" maxlength="60">
        <input class="eno" dir="ltr" placeholder="${esc(t('em.phNo'))}" maxlength="20">
        <input class="eu" dir="ltr" placeholder="${esc(t('em.phEmpUser'))}" maxlength="32" autocomplete="off">
        <button class="btn pri" data-act="addemp">${t('em.addEmp')}</button>
      </div>
      <details class="bulk"><summary>${t('em.many')}</summary>
        <textarea class="bulktxt" placeholder="${esc(t('em.phBulk') + '\n' + (VG.rtl ? 'خالد عمر، 0311' : 'Khaled Omar, 0311'))}"></textarea>
        <p>${t('em.bulkNote')}</p>
        <div style="margin-top:10px"><button class="btn pri" data-act="bulkemp">${t('em.create')}</button></div></details>
    </div></div>`; }).join('') : `<div class="empty">${t('ad.noCos')}</div>`;

  $('#regions').innerHTML = (data.regions || []).map((r) => `<span class="rgchip">${esc(r)}<button data-rg="${esc(r)}" title="${esc(t('ad.delRegion'))}" aria-label="${esc(t('ad.delRegionAria', { name: r }))}">✕</button></span>`).join('') || `<span class="muted" style="font-size:13px">${t('ad.noRegions')}</span>`;
  $('#cams').innerHTML = data.cameras.length ? data.cameras.map((c) => `
    <tr data-cam="${esc(c.id)}"><td style="width:46%"><span class="dot ${c.online ? 'on' : ''}"></span><b>${esc(c.id)}</b>${c.name && c.name !== c.id ? `<div class="muted" style="font-size:12px;margin-inline-start:17px">${esc(c.name)}</div>` : ''}</td>
      <td><select data-k="company">${`<option value="">${t('ad.noCompany')}</option>` + data.companies.map((co) => `<option value="${co.id}" ${c.companyId === co.id ? 'selected' : ''}>${esc(co.name)}</option>`).join('')}</select></td>
      <td><select data-k="region">${`<option value="">${t('ad.noRegion')}</option>` + (data.regions || []).map((r) => `<option ${c.region === r ? 'selected' : ''}>${esc(r)}</option>`).join('')}</select></td>
      <td style="white-space:nowrap"><button class="btn sm" data-tok="${esc(c.id)}" title="${esc(c.hasToken ? t('ad.rotateTitle') : t('ad.issueTitle'))}">${c.hasToken ? t('ad.rotate') : t('ad.issue')}</button></td>
      <td style="width:34px"><button class="btn sm danger" data-delcam="${esc(c.id)}" title="${esc(t('ad.removeCam'))}" aria-label="${esc(t('ad.removeAria', { id: c.id }))}">✕</button></td></tr>`).join('')
    : `<tr><td class="empty">${t('ad.noCams')}</td></tr>`;
}

$('#coAdd').onclick = () => {
  const name = $('#coName').value.trim();
  if (!name) return;
  const adminUsername = $('#coAdmin').value.trim(), adminPassword = adminUsername ? genPw() : '';
  api('POST', '/api/admin/companies', { name, maxCameras: $('#coPkg').value === '' ? null : Number($('#coPkg').value), features: ticked($('#newFeat'), 'data-nf'), adminUsername, adminPassword }).then((r) => { if (adminUsername) { lastCred[r.id] = { username: adminUsername, password: adminPassword }; openCo.add(r.id); } $('#coName').value = $('#coAdmin').value = ''; $('#newFeat').innerHTML = ''; toast(t('ad.t.coAdded')); return load(); }).catch(fail);
};
$('#coName').onkeydown = (e) => { if (e.key === 'Enter') $('#coAdd').click(); };

$('#companies').addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const co = b.closest('.co'), id = Number(co.dataset.id), act = b.dataset.act;
  if (act === 'toggle') { co.classList.toggle('open'); if (co.classList.contains('open')) openCo.add(id); else openCo.delete(id); return; }
  if (act === 'fall' || act === 'fnone') { const box = co.querySelector('.feat'); box.querySelectorAll('[data-f]').forEach((c) => { c.checked = act === 'fall'; }); syncBox(box, 'data-f'); return; }
  if (act === 'fsave') { api('PUT', `/api/admin/companies/${id}/features`, { features: ticked(co.querySelector('.feat'), 'data-f') }).then(() => { toast(t('ad.t.featSaved')); return load(); }).catch(fail); return; }
  if (act === 'logo') { pickPicture('company', id).then((ok) => ok && (toast(t('ad.t.logoSaved')), load())).catch(fail); return; }
  if (act === 'logorm') { removePicture('company', id).then(() => { toast(t('ad.t.logoRemoved')); return load(); }).catch(fail); return; }
  if (act === 'upic') { const uid = Number(b.closest('.user').dataset.uid); pickPicture('user', uid).then((ok) => ok && (toast(t('em.pictureSaved')), load())).catch(fail); return; }
  if (act === 'uacc') { const w = b.closest('.uw'), uid = Number(w.dataset.uid); w.classList.toggle('open'); w.classList.contains('open') ? openU.add(uid) : openU.delete(uid); return; }
  if (act === 'uall' || act === 'unone') { const box = b.closest('[data-ubox]'); box.querySelectorAll('[data-up]:not(:disabled)').forEach((c) => { c.checked = act === 'uall'; }); syncBox(box, 'data-up'); return; }
  if (act === 'usave') { const w = b.closest('.uw'); api('PUT', `/api/admin/users/${w.dataset.uid}/access`, { perms: ticked(w.querySelector('[data-ubox]'), 'data-up') }).then(() => { toast(t('em.accessSaved')); return load(); }).catch(fail); return; }
  if (act === 'mkadmin') {
    const base = (co.querySelector('h2').textContent.toLowerCase().replace(/[^a-z0-9]+/g, '').slice(0, 18) || 'company'), username = base + '.admin', password = genPw();
    api('POST', `/api/admin/companies/${id}/users`, { username, password, name: co.querySelector('h2').textContent + ' Administrator', role: 'manager' })
      .then(() => { lastCred[id] = { username, password }; toast(t('ad.t.adminMade')); return load(); }).catch(fail); return; }
  if (act === 'gen') { co.querySelector('.np').value = genPw(); return; }
  if (act === 'copy') { const c = lastCred[id]; navigator.clipboard?.writeText(`Username: ${c.username}\nPassword: ${c.password}`).then(() => toast(t('em.copied'))); return; }
  if (act === 'adduser') {
    const username = co.querySelector('.nu').value.trim(), password = co.querySelector('.np').value, name = co.querySelector('.nn').value.trim();
    api('POST', `/api/admin/companies/${id}/users`, { username, password, name, role: co.querySelector('.nr').value })
      .then(() => { lastCred[id] = { username, password }; toast(t('ad.t.userMade')); return load(); }).catch(fail);
  } else if (act === 'addemp') {
    const name = co.querySelector('.en').value.trim(), employeeNo = co.querySelector('.eno').value.trim(), username = co.querySelector('.eu').value.trim();
    api('POST', `/api/admin/companies/${id}/employees`, { employees: [{ name, employeeNo, username }] }).then((r) => {
      if (r.skipped.length) return toast(t('ad.t.notAdded', { reason: r.skipped[0].reason }));
      lastEmp[id] = r.created; toast(t('ad.t.empMade')); return load();
    }).catch(fail);
  } else if (act === 'bulkemp') {
    const lines = co.querySelector('.bulktxt').value.split('\n').map((l) => l.trim()).filter(Boolean);
    const employees = lines.map((l) => { const p = l.split(/[,;،\t]/).map((x) => x.trim()); return { name: p[0], employeeNo: p[1] || '', username: p[2] || '' }; });
    if (!employees.length) return toast(t('em.oneLine'));
    api('POST', `/api/admin/companies/${id}/employees`, { employees }).then((r) => {
      lastEmp[id] = r.created; toast(t('ad.t.nCreated', { n: r.created.length }) + (r.skipped.length ? t('ad.t.nSkipped', { n: r.skipped.length }) : ''));
      if (r.skipped.length) alert(t('em.notCreated') + '\n' + r.skipped.map((x) => `${x.name || t('em.noName')}: ${x.reason}`).join('\n'));
      return load();
    }).catch(fail);
  } else if (act === 'copyemp') {
    navigator.clipboard?.writeText(lastEmp[id].map((c) => `${c.name}\t${c.employeeNo || ''}\t${c.username}\t${c.password}`).join('\n')).then(() => toast(t('em.copied')));
  } else if (act === 'csvemp') {
    const q = (v) => '"' + String(v ?? '').replace(/"/g, '""') + '"';
    const csv = 'name,employee_no,username,password\n' + lastEmp[id].map((c) => [c.name, c.employeeNo, c.username, c.password].map(q).join(',')).join('\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' })); a.download = 'employee-logins.csv'; a.click();
  } else if (act === 'toggleemp') {
    const row = b.closest('.user'), off = row.classList.contains('is-off');
    if (off || confirm(t('em.confirmOff'))) api('PATCH', `/api/admin/users/${row.dataset.uid}`, { active: off }).then(load).catch(fail);
  } else if (act === 'editemp') {
    const row = b.closest('.user'), u = data.companies.find((c) => c.id === id).users.find((x) => x.id === Number(row.dataset.uid));
    const name = prompt(t('em.promptName'), u.name); if (name === null) return;
    const no = prompt(t('em.promptNo'), u.employeeNo || ''); if (no === null) return;
    api('PATCH', `/api/admin/users/${u.id}`, { name, employeeNo: no }).then(() => { toast(t('em.saved')); return load(); }).catch(fail);
  } else if (act === 'deluser') {
    if (confirm(t('ad.c.delUser'))) api('DELETE', `/api/admin/users/${b.closest('.user').dataset.uid}`).then(load).catch(fail);
  } else if (act === 'pw') {
    const pw = prompt(t('em.promptPw'), genPw());
    if (pw) api('POST', `/api/admin/users/${b.closest('.user').dataset.uid}/password`, { password: pw })
      .then(() => { toast(t('ad.t.pwDone')); }).catch(fail);
  } else if (act === 'delco') {
    if (confirm(t('ad.c.delCo'))) api('DELETE', `/api/admin/companies/${id}`).then(() => { delete lastCred[id]; return load(); }).catch(fail);
  }
});

function syncBox(box, attr, changed) {
  if (changed) fixNeeds(box, attr, changed);
  box.querySelectorAll('.fopt').forEach((l) => l.classList.toggle('on', l.querySelector('input').checked));
  const n = box.querySelector('.fcount'); if (n) n.textContent = attr === 'data-up' ? t('ad.nSelected', { n: ticked(box, attr).length }) : t('em.selected', { n: ticked(box, attr).length, total: nFeat() });
}
document.addEventListener('change', (e) => {
  const c = e.target.closest('[data-f],[data-nf],[data-up]'); if (!c) return;
  const attr = c.hasAttribute('data-f') ? 'data-f' : c.hasAttribute('data-nf') ? 'data-nf' : 'data-up';
  syncBox(c.closest('.feat, #newFeat, [data-ubox]'), attr, c);
});
$('#companies').addEventListener('change', (e) => {
  const sb = e.target.closest('select.subsel');
  if (sb) {
    const id = Number(sb.closest('.co').dataset.id); let body;
    if (sb.value === 'clear') body = { clear: true };
    else if (sb.value === 'date') { const d = prompt(t('ad.p.subEnd')); if (!d) { sb.value = ''; return; } body = { end: d.trim() }; }
    else if (sb.value) body = { months: Number(sb.value) }; else return;
    api('PUT', `/api/admin/companies/${id}/subscription`, body).then(() => { toast(t('ad.t.subUpdated')); return load(); }).catch((err) => { fail(err); load(); });
    return;
  }
  const sel = e.target.closest('select.pkg'); if (!sel) return;
  const id = Number(sel.closest('.co').dataset.id);
  api('PUT', `/api/admin/companies/${id}/package`, { maxCameras: sel.value === '' ? null : Number(sel.value) })
    .then(() => { toast(t('ad.t.pkgUpdated')); return load(); }).catch((err) => { fail(err); load(); });
});

$('#cams').addEventListener('change', (e) => {
  const sel = e.target.closest('select'); if (!sel) return;
  const id = encodeURIComponent(sel.closest('tr').dataset.cam);
  const req = sel.dataset.k === 'region'
    ? api('PUT', `/api/admin/cameras/${id}/region`, { region: sel.value === '' ? null : sel.value })
    : api('PUT', `/api/admin/cameras/${id}/company`, { companyId: sel.value === '' ? null : Number(sel.value) });
  req.then(() => { toast(t('em.saved')); return load(); }).catch((err) => { fail(err); load(); });
});
$('#newCamBtn').onclick = () => {
  const id = $('#newCamId').value.trim();
  if (!/^[\w.-]{1,32}$/.test(id)) return toast(t('ad.t.camIdBad'));
  api('POST', `/api/admin/cameras/${encodeURIComponent(id)}/token`).then((r) => {
    prompt(t('ad.p.token'), JSON.stringify({ id, token: r.token }));
    $('#newCamId').value = ''; toast(t('ad.t.camMade')); return load();
  }).catch(fail);
};
$('#cams').addEventListener('click', (e) => {
  const tk = e.target.closest('[data-tok]');
  if (tk) {
    const id = tk.dataset.tok;
    if (!confirm(t('ad.c.token', { id }))) return;
    api('POST', `/api/admin/cameras/${encodeURIComponent(id)}/token`).then((r) => {
      const cfg = JSON.stringify({ id, token: r.token });
      prompt(t('ad.p.token'), cfg);
      toast(t('ad.t.tokIssued')); return load();
    }).catch(fail);
    return;
  }
  const b = e.target.closest('[data-delcam]'); if (!b) return;
  const id = b.dataset.delcam;
  if (confirm(t('ad.c.removeCam', { id }))) api('DELETE', `/api/cameras/${encodeURIComponent(id)}`).then(() => { toast(t('ad.t.removed')); return load(); }).catch(fail);
});
$('#rmOffline').onclick = async () => {
  const off = data.cameras.filter((c) => !c.online);
  if (!off.length) return toast(t('ad.t.noOffline'));
  if (!confirm(t('ad.c.removeOff', { n: off.length, ids: off.map((c) => c.id).join(', ') }))) return;
  for (const c of off) await api('DELETE', `/api/cameras/${encodeURIComponent(c.id)}`).catch(() => { });
  toast(t('ad.t.removedN', { n: off.length })); load();
};
$('#rgAdd').onclick = () => {
  const name = $('#rgName').value.trim(); if (!name) return;
  api('POST', '/api/admin/regions', { name }).then(() => { $('#rgName').value = ''; toast(t('ad.t.regionAdded')); return load(); }).catch(fail);
};
$('#rgName').onkeydown = (e) => { if (e.key === 'Enter') $('#rgAdd').click(); };
$('#regions').addEventListener('click', (e) => {
  const b = e.target.closest('[data-rg]'); if (!b) return;
  if (confirm(t('ad.c.delRegion', { name: b.dataset.rg }))) api('DELETE', `/api/admin/regions/${encodeURIComponent(b.dataset.rg)}`).then(load).catch(fail);
});

$('#openAll').onclick = () => { data.companies.forEach((c) => openCo.add(c.id)); render(); };
$('#closeAll').onclick = () => { openCo.clear(); render(); };
portalReady.then(load);
</script>
</body>
</html>
