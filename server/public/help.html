<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="hp.pageTitle">Help &amp; Support - VisionGuard</title>
<script src="/i18n.js"></script>
<script src="/i18n/help.js"></script>
<link rel="icon" type="image/png" href="/brand/favicon.png">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
<link rel="stylesheet" href="/portal.css">
<style>
.hero{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;padding:26px 30px;border:0;color:#fff;position:relative;overflow:hidden;
  background:radial-gradient(700px 300px at 90% 0,rgba(47,123,255,.5),transparent 65%),radial-gradient(600px 300px at 0 100%,rgba(124,92,255,.55),transparent 65%),linear-gradient(135deg,#1B1442,#0E1B45)}
.hero h1{margin:0 0 6px;font-size:clamp(24px,3vw,34px);font-weight:800;letter-spacing:-.3px}
.hero h1 span{background:linear-gradient(90deg,#FFC857,#FF8A3D);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0;color:rgba(232,238,247,.82);font-size:14.5px;max-width:560px;line-height:1.5}
.cols{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.cols{grid-template-columns:1fr}}
details.q{border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-bottom:8px;overflow:hidden}
details.q summary{cursor:pointer;padding:13px 16px;font-weight:700;font-size:14px;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.q summary::after{content:"+";color:var(--mut);font-weight:800}details.q[open] summary::after{content:"–"}
details.q div{padding:0 16px 14px;color:var(--mut);font-size:13.5px;line-height:1.6}
.frm{display:grid;gap:12px}.frm .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.frm .row2{grid-template-columns:1fr}}
.frm label{display:grid;gap:5px;font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--mut)}
.frm input,.frm select,.frm textarea{font:inherit;font-size:14px;letter-spacing:0;text-transform:none;font-weight:500;color:var(--text)}
.frm textarea{min-height:120px;resize:vertical}
.note{padding:11px 14px;border-radius:12px;font-size:13px;line-height:1.5;background:color-mix(in srgb,var(--blue) 10%,transparent);border:1px solid color-mix(in srgb,var(--blue) 30%,var(--line))}
.note.ok{background:color-mix(in srgb,var(--ok) 12%,transparent);border-color:color-mix(in srgb,var(--ok) 35%,var(--line))}
.note.warn{background:color-mix(in srgb,var(--sel) 14%,transparent);border-color:color-mix(in srgb,var(--sel) 40%,var(--line))}
.tk{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);cursor:pointer;margin-bottom:8px}
.tk:hover,.tk.on{border-color:var(--sel)}.tk b{display:block;font-size:14px}.tk small{color:var(--mut);font-size:12px}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:11px;font-weight:800;background:color-mix(in srgb,var(--c,var(--off)) 14%,transparent);color:var(--c,var(--mut));white-space:nowrap}
.s-open{--c:var(--sel)}.s-in_progress{--c:var(--blue)}.s-resolved{--c:var(--ok)}.s-closed{--c:var(--off)}
.p-urgent{--c:var(--rec)}.p-high{--c:var(--sel)}.p-normal{--c:var(--blue)}.p-low{--c:var(--off)}
.msg{padding:12px 14px;border-radius:12px;margin-bottom:10px;background:var(--raise);border:1px solid var(--line-soft);white-space:pre-wrap;line-height:1.55;font-size:14px}
.msg.staff{background:color-mix(in srgb,var(--brand) 9%,transparent);border-color:color-mix(in srgb,var(--brand) 28%,var(--line))}
.msg small{display:block;color:var(--mut);font-weight:700;margin-bottom:4px;font-size:11.5px;white-space:normal}
.fchips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.fchips button{padding:5px 13px;border-radius:99px;border:1px solid var(--line);background:var(--panel);font-weight:700;font-size:12.5px;color:var(--mut);cursor:pointer}
.fchips button.on{background:linear-gradient(135deg,var(--sel),#ff9d00);border-color:transparent;color:var(--sel-ink)}
.empty{color:var(--mut);font-size:13px;padding:14px 0}
</style>
<link rel="stylesheet" href="/i18n.css">
</head>
<body>
<header id="top"></header>
<main>
  <section class="card hero">
    <div><h1 data-i18n-html="hp.h1">Help &amp; <span>Support</span></h1>
      <p data-i18n-html="hp.lead">Find a quick answer, or open a ticket and the Smart Way support team will answer you right here. You can also write to <a id="mailTop" style="color:#FFC857;font-weight:700" href="mailto:sdpt@smart-way.com.sa">sdpt@smart-way.com.sa</a>.</p></div>
    <a class="btn pri" href="#new" id="goNew" style="font-size:16px;padding:14px 26px" data-i18n="hp.openTicket">Open a ticket</a>
  </section>

  <section class="cols">
    <div class="card"><h3 data-i18n="hp.quick">Quick answers</h3><div id="faq"></div></div>
    <div class="card" id="new"><h3 data-i18n="hp.openTicket">Open a ticket</h3>
      <form class="frm" id="tf" autocomplete="off">
        <label><span data-i18n="hp.subject">Subject</span><input id="tSub" maxlength="120" placeholder="e.g. Camera BWC-03 shows offline" data-i18n-ph="hp.phSubject" required></label>
        <div class="row2">
          <label><span data-i18n="hp.about">About</span><select id="tCat"><option value="question" data-i18n="hp.cat.question">A question</option><option value="camera" data-i18n="hp.cat.camera">A camera</option><option value="docking" data-i18n="hp.cat.docking">The docking station</option><option value="live" data-i18n="hp.cat.live">Live view</option><option value="alerts" data-i18n="hp.cat.alerts">Alerts / SOS</option><option value="account" data-i18n="hp.cat.account">My account</option><option value="app" data-i18n="hp.cat.app">The mobile app</option><option value="other" data-i18n="hp.cat.other">Something else</option></select></label>
          <label><span data-i18n="hp.priority">Priority</span><select id="tPri"><option value="normal" data-i18n="hp.pri.normal">Normal</option><option value="low" data-i18n="hp.pri.low">Low</option><option value="high" data-i18n="hp.pri.high">High</option><option value="urgent" data-i18n="hp.pri.urgentLong">Urgent (cameras are not working)</option></select></label>
        </div>
        <label><span data-i18n="hp.camera">Camera (optional)</span><select id="tCam"><option value="" data-i18n="hp.none">None</option></select></label>
        <label><span data-i18n="hp.what">What happened?</span><textarea id="tDesc" maxlength="4000" placeholder="What did you do, what did you expect, what happened instead? The more detail, the faster we can help." data-i18n-ph="hp.phWhat" required></textarea></label>
        <div id="tMsg"></div>
        <button class="btn pri" id="tGo" type="submit" style="justify-self:start" data-i18n="hp.send">Send to support</button>
      </form></div>
  </section>

  <section class="cols" id="mine">
    <div class="card"><h3 id="lTitle" data-i18n="hp.myTickets">My tickets</h3><div class="fchips" id="fch"></div><div id="tl"><div class="empty" data-i18n="common.loading">Loading…</div></div></div>
    <div class="card" id="det"><h3 data-i18n="hp.conversation">Conversation</h3><div class="empty" data-i18n="hp.choose">Choose a ticket to read the conversation and reply.</div></div>
  </section>
</main>

<script src="/portal.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const t = VG.t, th = VG.h;
const esc = (x) => String(x ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const when = (ts) => VG.dateTime(ts, { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
const ST = Object.fromEntries(['open', 'in_progress', 'resolved', 'closed'].map((k) => [k, t('hp.st.' + k)])), PR = Object.fromEntries(['urgent', 'high', 'normal', 'low'].map((k) => [k, t('hp.pri.' + k)]));
let info = { email: 'sdpt@smart-way.com.sa', staff: false }, filter = '', cur = null, tickets = [];

const FAQ = [1, 2, 3, 4, 5, 6, 7, 8].map((n) => [t('hp.f' + n + 'q'), t('hp.f' + n + 'a')]);
$('#faq').innerHTML = FAQ.map(([q, a]) => `<details class="q"><summary>${esc(q)}</summary><div>${esc(a)}</div></details>`).join('');

async function loadList() {
  const r = await fetch('/api/tickets' + (filter ? '?status=' + filter : '')); tickets = (await r.json()).tickets || [];
  $('#lTitle').textContent = info.staff ? t('hp.allTickets') : t('hp.myTickets');
  $('#fch').innerHTML = [['', t('hp.all')], ...Object.entries(ST)].map(([k, l]) => `<button data-f="${k}" class="${filter === k ? 'on' : ''}">${l}</button>`).join('');
  $('#tl').innerHTML = tickets.length ? tickets.map((k) => `<div class="tk ${cur === k.id ? 'on' : ''}" data-id="${k.id}"><div><b>${esc(k.subject)}</b><small>${esc(k.ref)} · ${when(k.updated)}${info.staff ? ' · ' + esc(k.by) + (k.company ? ' · ' + esc(k.company) : '') : ''}${k.replies ? ' · ' + esc(t('hp.replies', { n: k.replies })) : ''}</small></div>
    <div style="display:grid;gap:4px;justify-items:end"><span class="chip s-${k.status}">${ST[k.status]}</span><span class="chip p-${k.priority}">${PR[k.priority]}</span></div></div>`).join('') : `<div class="empty">${t('hp.noTickets')}</div>`;
}
async function openTicket(id) {
  cur = id; const r = await fetch('/api/tickets/' + id); if (!r.ok) return;
  const k = await r.json();
  const canStatus = info.staff;
  $('#det').innerHTML = `<h3>${esc(k.ref)} · ${esc(k.subject)}</h3>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin:-4px 0 12px"><span class="chip s-${k.status}">${ST[k.status]}</span><span class="chip p-${k.priority}">${PR[k.priority]}</span><span class="chip" style="--c:var(--mut)">${esc(VG.has('hp.cat.' + k.category) ? t('hp.cat.' + k.category) : k.category)}</span>${k.cameraId ? `<span class="chip" style="--c:var(--blue)">${esc(k.cameraId)}</span>` : ''}</div>
    ${k.messages.map((m) => `<div class="msg ${m.staff ? 'staff' : ''}"><small><bdi>${esc(m.author)}</bdi>${m.staff ? t('hp.supportTag') : ''} · ${when(m.ts)}</small>${esc(m.body)}</div>`).join('')}
    ${k.status === 'closed' ? `<div class="note">${t('hp.closedNote')}</div>` : ''}
    <div class="frm" style="margin-top:12px"><textarea id="rBody" placeholder="${esc(t('hp.phReply'))}" maxlength="4000"></textarea>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><button class="btn pri" id="rGo">${t('hp.sendReply')}</button>
        ${canStatus ? `<select id="rSt">${Object.entries(ST).map(([key, v]) => `<option value="${key}" ${k.status === key ? 'selected' : ''}>${v}</option>`).join('')}</select><button class="btn" id="rSet">${t('hp.setStatus')}</button>`
          : (k.status !== 'closed' ? `<button class="btn" id="rClose">${t('hp.closeTicket')}</button>` : '')}<span class="muted" id="rMsg"></span></div></div>`;
  $('#rGo').onclick = async () => {
    const body = $('#rBody').value.trim(); if (body.length < 2) return;
    const x = await fetch(`/api/tickets/${id}/messages`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ body }) });
    if (x.ok) { await openTicket(id); loadList(); } else $('#rMsg').textContent = (await x.json()).error || t('hp.couldNotSend');
  };
  if ($('#rSet')) $('#rSet').onclick = async () => { await fetch(`/api/tickets/${id}/status`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status: $('#rSt').value }) }); openTicket(id); loadList(); };
  if ($('#rClose')) $('#rClose').onclick = async () => { await fetch(`/api/tickets/${id}/status`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status: 'closed' }) }); openTicket(id); loadList(); };
  history.replaceState(null, '', '#t=' + id);
}
$('#tl').addEventListener('click', (e) => { const k = e.target.closest('.tk'); if (k) { openTicket(Number(k.dataset.id)); loadList(); } });
$('#fch').addEventListener('click', (e) => { const b = e.target.closest('button[data-f]'); if (b) { filter = b.dataset.f; loadList(); } });
$('#goNew').onclick = (e) => { e.preventDefault(); $('#new').scrollIntoView({ behavior: 'smooth' }); $('#tSub').focus(); };

$('#tf').onsubmit = async (e) => {
  e.preventDefault(); const b = $('#tGo'); b.disabled = true; $('#tMsg').innerHTML = '';
  const r = await fetch('/api/tickets', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ subject: $('#tSub').value, category: $('#tCat').value, priority: $('#tPri').value, cameraId: $('#tCam').value, description: $('#tDesc').value }) });
  const j = await r.json(); b.disabled = false;
  if (!r.ok) { $('#tMsg').innerHTML = `<div class="note warn">${esc(j.error || t('hp.couldNotSendTicket'))}</div>`; return; }
  $('#tMsg').innerHTML = j.emailed ? `<div class="note ok">${th('hp.sentOk', { ref: j.ref })}</div>`
    : `<div class="note ok">${th('hp.savedOk', { ref: j.ref, email: info.email, subj: encodeURIComponent(j.ref) })}</div>`;
  $('#tf').reset(); await loadList(); openTicket(j.id);
};

portalReady.then(async (me) => {
  info = await (await fetch('/api/support/info')).json();
  if (info.staff) {   // Smart Way support answers tickets: an inbox, no form to open one
    document.querySelector('.hero h1').innerHTML = t('hp.h1Staff');
    document.querySelector('.hero p').textContent = t('hp.leadStaff');
    document.getElementById('goNew').style.display = 'none';
    document.getElementById('new').closest('section').style.display = 'none';
    document.querySelector('main').appendChild(document.getElementById('mine'));
    filter = 'open';
  }
  if ($('#mailTop')) { $('#mailTop').textContent = info.email; $('#mailTop').href = 'mailto:' + info.email; }
  if (info.staff && !info.emailConfigured) $('#tMsg').innerHTML = `<div class="note warn">${t('hp.noMail')}</div>`;
  try { const d = await (await fetch('/api/docks')).json(); $('#tCam').innerHTML = `<option value="">${t('hp.none')}</option>` + (d.cameras || []).map((c) => `<option>${esc(c.cameraId)}</option>`).join(''); } catch (e) { /* optional */ }
  await loadList();
  const m = /#t=(\d+)/.exec(location.hash); if (m) openTicket(Number(m[1]));
  setInterval(() => { if (!document.hidden) loadList(); }, 20000);
});
</script>
</body>
</html>
