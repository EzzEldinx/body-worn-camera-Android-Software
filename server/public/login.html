<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in - VisionGuard | Smart Way Group</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("bwc-theme")||"light"}catch(e){document.documentElement.dataset.theme="light"}</script>
<style>
:root{--bg:#EEF2F8;--panel:#fff;--raise:#F2F5FA;--line:#DAE2EC;--text:#0F1B2D;--mut:#62738C;--brand:#5E4A9E;--sel:#FFB300;--sel-ink:#1A1405;--rec:#E5384F;--ok:#00B87C;
--glow:0 0 0 1px rgba(255,179,0,.55),0 4px 18px rgba(255,179,0,.38);
font-family:Bahnschrift,"Segoe UI",system-ui,sans-serif;color-scheme:light}
:root[data-theme="dark"]{--bg:#0B1322;--panel:#131E33;--raise:#1A2842;--line:#273A5B;--text:#E8EEF7;--mut:#8A9BB5;--brand:#9B86E0;--sel:#FFC857;--rec:#FF5D77;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(420px,.8fr);background:var(--bg);color:var(--text);overflow:hidden}

/* ================= HERO (left, full height, image from the company presentation) ================= */
.hero{position:relative;overflow:hidden;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:0 56px 64px;background:#0A1233}
.hero-img{position:absolute;inset:0 0 auto 0;height:78%;background:url(/hero.jpg) 66% top/cover no-repeat;
  -webkit-mask-image:linear-gradient(#000 58%,transparent);mask-image:linear-gradient(#000 58%,transparent);animation:drift 24s ease-in-out infinite alternate}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(900px 500px at 50% 100%,rgba(94,74,158,.55),transparent 70%)}
.hero-main{position:relative;z-index:2;max-width:640px}
.bar{width:64px;height:5px;border-radius:3px;background:linear-gradient(90deg,#FFC857,#FF8A3D);margin-bottom:22px;box-shadow:0 0 18px rgba(255,179,0,.6)}
h2{margin:0 0 14px;font-size:clamp(34px,4.2vw,60px);line-height:1.05;font-weight:800;letter-spacing:-.5px;text-shadow:0 4px 30px rgba(0,0,0,.5)}
h2 span{background:linear-gradient(90deg,#FFC857,#FF8A3D);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{margin:0;font-size:clamp(13px,1.1vw,16px);letter-spacing:2.4px;text-transform:uppercase;color:rgba(232,238,247,.82)}
@keyframes drift{from{transform:scale(1) translateX(0)}to{transform:scale(1.06) translateX(-1.5%)}}

/* ================= LOGIN (right) ================= */
.side{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;background:var(--bg)}
.tools{position:absolute;top:20px;right:24px;display:flex;gap:8px}
.tools button{height:36px;min-width:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--mut);font:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
.tools button:hover{color:var(--text);box-shadow:var(--glow)}
form{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:38px 34px 30px;box-shadow:0 24px 60px rgba(15,27,45,.14)}
.mlogo{display:none;height:34px;margin:0 auto 18px}
form h1{margin:0 0 6px;font-size:28px;font-weight:800;letter-spacing:-.3px}
form p.sub{margin:0 0 8px;color:var(--mut);font-size:14px}
label{display:block;font-size:13px;font-weight:600;margin:20px 0 7px}
.field{position:relative}
.field svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;fill:none;stroke:var(--mut);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
input{width:100%;padding:13px 14px 13px 44px;border-radius:12px;border:1px solid var(--line);background:var(--raise);color:var(--text);font:inherit;font-size:15px;transition:.15s}
input:focus{outline:none;background:var(--panel);border-color:var(--sel);box-shadow:var(--glow)}
.eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--mut);cursor:pointer;padding:6px;border-radius:8px;display:flex}
.eye svg{position:static;transform:none}
.eye:hover{color:var(--text)}
#p{padding-right:44px}
#b{width:100%;margin-top:26px;padding:14px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--sel),#FF9D00);color:var(--sel-ink);font:inherit;font-size:15.5px;font-weight:800;cursor:pointer;box-shadow:0 8px 22px rgba(255,179,0,.42);transition:.15s}
#b:hover{transform:translateY(-1px);filter:brightness(1.04)}
#b:focus-visible{outline:2px solid var(--brand);outline-offset:3px}
#b:disabled{opacity:.6;cursor:default;transform:none}
#err{min-height:20px;margin-top:14px;color:var(--rec);font-size:14px;text-align:center}
.secure{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px;color:var(--mut);font-size:12px}
.secure svg{width:14px;height:14px;fill:none;stroke:var(--ok);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.copy{margin-top:22px;color:var(--mut);font-size:12px}

[dir="rtl"] .field svg{left:auto;right:14px}
[dir="rtl"] input{padding:13px 44px 13px 14px}
[dir="rtl"] #p{padding-left:44px}
[dir="rtl"] .eye{right:auto;left:8px}
[dir="rtl"] .tools{right:auto;left:24px}

@media (max-width:980px){
  body{grid-template-columns:1fr;overflow:auto}
  .hero{display:none}
  .mlogo{display:block}
  .side{min-height:100vh}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>

<section class="hero" aria-hidden="true">
  <div class="hero-img"></div>
  <div class="hero-main">
    <div class="bar"></div>
    <h2><span data-i="h1a">See every moment.</span><br><span data-i="h1b" style="background:none;-webkit-background-clip:initial;color:#fff">Secure every evidence.</span></h2>
    <p class="tag" data-i="brand">Smart Way Group &middot; Solution for Secure Future</p>
  </div>
</section>

<section class="side">
  <div class="tools">
    <button id="lang" type="button" aria-label="Language">عربي</button>
    <button id="theme" type="button" aria-label="Toggle theme">◐</button>
  </div>

  <form id="f">
    <img class="mlogo" src="/logo.png" alt="Smart Way">
    <h1 data-i="title">Welcome back</h1>
    <p class="sub" data-i="sub">Sign in to your VisionGuard account.</p>

    <label for="u" data-i="user">Username</label>
    <div class="field">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <input id="u" autocomplete="username" required autofocus>
    </div>

    <label for="p" data-i="pass">Password</label>
    <div class="field">
      <svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>
      <input id="p" type="password" autocomplete="current-password" required>
      <button class="eye" type="button" id="eye" aria-label="Show password"><svg viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>

    <button id="b" data-i="signin">Sign in</button>
    <div id="err" role="alert"></div>
    <div class="secure"><svg viewBox="0 0 24 24"><path d="M12 2.5 4.5 5.5v6c0 4.6 3.1 8.3 7.5 10 4.4-1.7 7.5-5.4 7.5-10v-6z"/><path d="M9 12l2 2 4-4"/></svg><span data-i="secure">Encrypted, authorized access only</span></div>
  </form>

  <div class="copy">&copy; 2026 Smart Way Group</div>
</section>

<script>
const T = {
  en: { h1a:'See every moment.', h1b:'Secure every evidence.', brand:'Smart Way Group · Solution for Secure Future',
    title:'Welcome back', sub:'Sign in to your VisionGuard account.', user:'Username', pass:'Password',
    signin:'Sign in', secure:'Encrypted, authorized access only', fail:'Sign in failed.', net:'Cannot reach the server. Check your connection.' },
  ar: { h1a:'شاهد كل لحظة.', h1b:'أمّن كل دليل.', brand:'مجموعة سمارت واي · حلول لمستقبل آمن',
    title:'مرحباً بعودتك', sub:'سجّل الدخول إلى حسابك في VisionGuard.', user:'اسم المستخدم', pass:'كلمة المرور',
    signin:'تسجيل الدخول', secure:'دخول مشفّر ومصرّح به فقط', fail:'فشل تسجيل الدخول.', net:'تعذّر الوصول إلى الخادم. تحقق من الاتصال.' }
};
let L = 'en';
try { L = localStorage.getItem('bwc-lang') || 'en'; } catch (e) {}
function apply() {
  document.documentElement.lang = L; document.documentElement.dir = L === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-i]').forEach((el) => { el.textContent = T[L][el.dataset.i]; });
  document.getElementById('lang').textContent = L === 'ar' ? 'EN' : 'عربي';
}
apply();
document.getElementById('lang').onclick = () => { L = L === 'ar' ? 'en' : 'ar'; try { localStorage.setItem('bwc-lang', L); } catch (e) {} apply(); };
document.getElementById('theme').onclick = () => {
  const n = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = n; try { localStorage.setItem('bwc-theme', n); } catch (e) {}
};
document.getElementById('eye').onclick = () => { const p = document.getElementById('p'); p.type = p.type === 'password' ? 'text' : 'password'; };

document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const b = document.getElementById('b'), err = document.getElementById('err');
  b.disabled = true; err.textContent = '';
  try {
    const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: document.getElementById('u').value, password: document.getElementById('p').value }) });
    if (r.ok) return (location.href = '/analytics.html'); // landing page: analytics, then the live dashboard
    err.textContent = (await r.json()).error || T[L].fail;
  } catch (x) { err.textContent = T[L].net; }
  b.disabled = false;
});
</script>
</body>
</html>
