<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in - SWG Command Center</title>
<style>
:root{--bg:#0f1828;--panel:#162238;--line:#2a3b5a;--text:#e8eef7;--mut:#8a9bb5;--sel:#ffc857;--rec:#ff5d73;
font-family:Bahnschrift,"Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text)}
form{width:min(360px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:32px 28px}
.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:600;margin-bottom:6px}
.brand svg{width:28px;height:28px}
p{margin:0 0 10px;color:var(--mut);font-size:14px}
label{display:block;font-size:14px;margin:16px 0 6px}
input{width:100%;padding:11px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
input:focus-visible,button:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
button{width:100%;margin-top:22px;padding:12px;border:0;border-radius:8px;background:var(--sel);color:#1a1405;font:inherit;font-weight:600;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
#err{min-height:20px;margin-top:14px;color:var(--rec);font-size:14px}
</style>
</head>
<body>
<form id="f">
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="#ffc857" stroke-width="1.8"><path d="M12 2.5 4.5 5.5v6c0 4.6 3.1 8.3 7.5 10 4.4-1.7 7.5-5.4 7.5-10v-6z"/><circle cx="12" cy="11" r="2.6"/></svg>
    SWG Command Center
  </div>
  <p>Sign in with your dispatcher account.</p>
  <label for="u">Username</label>
  <input id="u" autocomplete="username" required autofocus>
  <label for="p">Password</label>
  <input id="p" type="password" autocomplete="current-password" required>
  <button id="b">Sign in</button>
  <div id="err" role="alert"></div>
</form>
<script>
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const b = document.getElementById('b'), err = document.getElementById('err');
  b.disabled = true; err.textContent = '';
  try {
    const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: document.getElementById('u').value, password: document.getElementById('p').value }) });
    if (r.ok) return (location.href = '/');
    err.textContent = (await r.json()).error || 'Sign in failed.';
  } catch (x) { err.textContent = 'Cannot reach the server. Check your connection.'; }
  b.disabled = false;
});
</script>
</body>
</html>
