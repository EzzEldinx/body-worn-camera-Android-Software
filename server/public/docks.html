<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Docking Station - VisionGuard</title>
<link rel="icon" type="image/png" href="/brand/favicon.png">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
<link rel="stylesheet" href="/portal.css">
<style>
:root{--c-idle:var(--off);--c-ready:var(--blue);--c-busy:var(--sel);--c-done:var(--ok);--c-err:var(--rec)}
body{overflow-x:hidden}
.shell{display:grid;grid-template-columns:96px minmax(0,1fr);gap:0;max-width:1700px;margin:0 auto;min-height:calc(100vh - var(--header-h))}
main#view{display:block;max-width:none;margin:0;padding:22px 24px 90px;display:grid;gap:18px;align-content:start;min-width:0}

/* ---------- left rail ---------- */
.rail{position:sticky;top:var(--header-h);align-self:start;height:calc(100vh - var(--header-h));display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 0;border-right:1px solid var(--line);background:linear-gradient(180deg,color-mix(in srgb,var(--panel) 92%,transparent),color-mix(in srgb,var(--raise) 92%,transparent))}
.rb{width:80px;display:flex;flex-direction:column;align-items:center;gap:7px;padding:10px 0 9px;border:0;background:none;color:var(--mut);font-size:11.5px;font-weight:700;letter-spacing:.3px;border-radius:14px;position:relative;transition:.18s}
.rb .dot{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(145deg,var(--g1),var(--g2));box-shadow:0 6px 16px color-mix(in srgb,var(--g2) 45%,transparent),inset 0 1px 0 rgba(255,255,255,.45),inset 0 -6px 10px rgba(0,0,0,.18);transition:.18s}
.rb .dot svg{width:22px;height:22px}
.rb:hover{color:var(--text)}
.rb:hover .dot{transform:translateY(-2px) scale(1.04)}
.rb.on{color:var(--text);background:var(--panel);box-shadow:var(--shadow-sm)}
.rb.on .dot{box-shadow:0 0 0 3px var(--panel),0 0 0 5px var(--g1),0 8px 22px color-mix(in srgb,var(--g2) 55%,transparent),inset 0 1px 0 rgba(255,255,255,.45)}
.rb.on::before{content:"";position:absolute;left:-8px;top:22%;bottom:22%;width:4px;border-radius:0 4px 4px 0;background:linear-gradient(var(--sel),var(--brand))}
.rb[data-v="docks"]{--g1:#7C5CFF;--g2:#2F7BFF}.rb[data-v="cams"]{--g1:#FF5D77;--g2:#D81B49}.rb[data-v="data"]{--g1:#FFC857;--g2:#FF8A3D}
.rb[data-v="set"]{--g1:#2EE6A6;--g2:#009C6B}.rb[data-v="help"]{--g1:#5AA9FF;--g2:#2F4FD8}
.rail .sp{flex:1}

/* ---------- title + KPIs ---------- */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.top h1{margin:0;font-size:clamp(24px,2.6vw,32px);font-weight:800;letter-spacing:-.4px}
.top h1 span{background:linear-gradient(90deg,var(--brand),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
.top p{margin:4px 0 0;color:var(--mut);font-size:14px}
.agent{display:inline-flex;align-items:center;gap:9px;padding:8px 14px;border-radius:99px;font-size:12.5px;font-weight:700;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow-sm)}
.agent i{width:9px;height:9px;border-radius:50%;background:var(--off)}
.agent.on i{background:var(--ok);animation:pulse 1.8s infinite}
.agent.on{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.agent small{color:var(--mut);font-weight:600}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 65%,transparent)}100%{box-shadow:0 0 0 10px transparent}}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:16px;background:linear-gradient(135deg,var(--panel),var(--raise));border:1px solid var(--line);box-shadow:var(--shadow-sm)}
.kpi .ki{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex:none;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);box-shadow:0 0 18px color-mix(in srgb,var(--c) 30%,transparent)}
.kpi .ki svg{width:22px;height:22px}
.kpi b{display:block;font-size:28px;line-height:1;font-weight:800}
.kpi span{display:block;margin-top:5px;color:var(--mut);font-size:11.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase}

/* ---------- bays ---------- */
.dockpick{display:flex;gap:8px;flex-wrap:wrap}
.pill{padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:var(--panel);font-size:12.5px;font-weight:700;color:var(--mut)}
.pill.on{background:linear-gradient(135deg,var(--sel),#ff9d00);border-color:transparent;color:var(--sel-ink)}
.bays{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.bay{--c:var(--c-idle);position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 16px 18px;min-height:318px;border-radius:20px;overflow:hidden;cursor:default;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 7%,var(--panel)),var(--panel) 55%);border:1px solid color-mix(in srgb,var(--c) 28%,var(--line));box-shadow:var(--shadow-sm);transition:border-color .25s,box-shadow .25s,transform .2s}
.bay::before{content:"";position:absolute;inset:0;background:radial-gradient(260px 160px at 50% 28%,color-mix(in srgb,var(--c) 16%,transparent),transparent 70%);pointer-events:none}
.bay>*{position:relative}
.bay.has{cursor:pointer}.bay.has:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}
.bay.s-connected{--c:var(--c-ready)}.bay.s-offloading{--c:var(--c-busy);box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 55%,transparent),0 10px 34px color-mix(in srgb,var(--c) 28%,transparent)}
.bay.s-synced{--c:var(--c-done)}.bay.s-error{--c:var(--c-err);box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 55%,transparent),0 10px 34px color-mix(in srgb,var(--c) 26%,transparent)}
.bhead{align-self:stretch;display:flex;align-items:center;justify-content:space-between}
.bn{font-size:11px;font-weight:800;letter-spacing:1.4px;color:var(--mut)}
.st{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:10.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.s-offloading .st::before,.s-connected .st::before{animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.ring{position:relative;width:132px;height:132px;margin-top:4px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ring .tr{stroke:color-mix(in srgb,var(--c) 18%,var(--line-soft));fill:none}
.ring .vl{stroke:var(--c);fill:none;stroke-linecap:round;transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 7px color-mix(in srgb,var(--c) 70%,transparent))}
.ring .sw{stroke:var(--c);fill:none;stroke-linecap:round;stroke-dasharray:60 280;opacity:.9;transform-origin:60px 60px;animation:spin 1.5s linear infinite;filter:drop-shadow(0 0 6px var(--c))}
.s-idle .ring .sw,.s-synced .ring .sw,.s-error .ring .sw{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center}
.ring .mid b{font-size:26px;line-height:1;font-weight:800;color:var(--text)}
.ring .mid small{font-size:10.5px;color:var(--mut);font-weight:700;letter-spacing:.6px;text-transform:uppercase}
.ring .mid.idle b{font-size:22px;color:var(--mut);font-family:Georgia,"Times New Roman",serif;font-weight:700}
.ring .mid svg{width:42px;height:42px;color:var(--c);transform:none}
.cid{margin-top:2px;font-size:17px;font-weight:800;letter-spacing:.2px}
.co{margin-top:-4px;font-size:12px;color:var(--mut);min-height:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:26px}
.ch{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:99px;font-size:11.5px;font-weight:700;background:var(--raise);border:1px solid var(--line-soft)}
.ch svg{width:13px;height:13px;color:var(--mut)}
.ch.low{color:var(--rec);border-color:color-mix(in srgb,var(--rec) 40%,var(--line))}.ch.low svg{color:var(--rec)}
.bar{align-self:stretch;height:6px;border-radius:99px;background:color-mix(in srgb,var(--c) 14%,var(--line-soft));overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 55%,#fff));transition:width .8s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 10px var(--c)}
.pf{align-self:stretch;font-size:11.5px;color:var(--mut);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hint{font-size:12.5px;color:var(--mut);text-align:center;line-height:1.45;padding:0 6px}
.s-idle .cid{color:var(--mut)}

/* ---------- status bar ---------- */
.statusbar{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:14px 20px;border-radius:16px;background:linear-gradient(90deg,#0B2A66,#1650B8 55%,#1E7BE8);color:#fff;box-shadow:var(--shadow-md)}
.statusbar .lbl{font-size:12.5px;font-weight:700;letter-spacing:.4px;opacity:.9;white-space:nowrap}
.meter{flex:1;min-width:180px;height:12px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden;position:relative}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,#2EE6A6,#9BF2D2);box-shadow:0 0 12px rgba(46,230,166,.8);transition:width 1s}
.statusbar .num{font-size:13px;font-weight:800;white-space:nowrap}

/* ---------- tables / forms ---------- */
.bar2{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bar2 input,.bar2 select{min-width:150px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;padding:10px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.9px;color:var(--mut);background:var(--panel);border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
.tbl tr:hover td{background:var(--hover)}
.tbl .r{text-align:right}.tbl .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--mut)}
.scroll{overflow:auto;border-radius:12px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:800;background:color-mix(in srgb,var(--c,var(--off)) 14%,transparent);color:var(--c,var(--mut))}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c,var(--off))}
.b-on{--c:var(--ok)}.b-rec{--c:var(--rec)}.b-off{--c:var(--off)}.b-dock{--c:var(--blue)}
.empty{padding:40px 12px;text-align:center;color:var(--mut)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.mini{padding:16px 18px;border-radius:16px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow-sm);display:grid;gap:8px}
.mini h4{margin:0;font-size:15px}.mini .row{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--mut)}.mini .row b{color:var(--text)}
pre.code{margin:0;padding:14px 16px;border-radius:12px;background:#0A111D;color:#CFE3FF;font:12.5px/1.6 ui-monospace,Menlo,Consolas,monospace;overflow:auto;white-space:pre-wrap;word-break:break-all}
.kv{display:grid;grid-template-columns:minmax(120px,200px) 1fr;gap:10px 18px;font-size:14px}.kv dt{color:var(--mut)}.kv dd{margin:0;font-weight:600}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;counter-reset:s}
.step{position:relative;padding:18px 18px 16px 18px;border-radius:16px;background:var(--panel);border:1px solid var(--line);counter-increment:s}
.step::before{content:counter(s);display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;margin-bottom:10px;font-weight:800;color:var(--sel-ink);background:linear-gradient(135deg,var(--sel),#ff9d00)}
.step b{display:block;margin-bottom:4px}.step span{color:var(--mut);font-size:13.5px;line-height:1.5}
details{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:12px 16px}details+details{margin-top:8px}
summary{cursor:pointer;font-weight:700}details p{color:var(--mut);margin:8px 0 0;line-height:1.55;font-size:13.5px}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(8,13,24,.78);backdrop-filter:blur(6px)}
.modal.on{display:flex}
.mbox{width:min(920px,100%);max-height:92vh;overflow:auto;border-radius:18px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow-md)}
.mbox header{position:static;height:auto;padding:14px 18px;justify-content:space-between;box-shadow:none}
.mbox header::after{display:none}
.mbox video,.mbox img{display:block;width:100%;max-height:70vh;background:#000;object-fit:contain}
.mbody{padding:16px 18px}

/* ---------- phones: rail becomes a bottom bar ---------- */
@media (max-width:1280px){.bays{grid-template-columns:repeat(3,minmax(0,1fr))}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;flex-direction:row;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);z-index:30}
  .rail .sp{display:none}
  .rb{width:auto;flex:1;padding:6px 0 5px;font-size:10.5px}.rb .dot{width:36px;height:36px}.rb .dot svg{width:18px;height:18px}.rb.on::before{display:none}
  .rb.on .dot{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--g1)}
  main#view{padding:16px 14px 100px}
  .bays{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.bay{min-height:290px;padding:12px 10px 14px}.ring{width:112px;height:112px}
  .kv{grid-template-columns:1fr}
  nav{display:none}
}
@media (max-width:560px){.bays{grid-template-columns:minmax(0,1fr)}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi{padding:12px}.kpi b{font-size:22px}}
@media (prefers-reduced-motion:reduce){.ring .sw,.agent.on i,.st::before{animation:none}}
</style>
</head>
<body>
<header id="top"></header>
<div class="shell">
  <aside class="rail" id="rail" aria-label="Docking sections"></aside>
  <main id="view"></main>
</div>
<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>

<script src="/portal.js"></script>
<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const IC = {
  dock: '<path d="M4 15h16v4a1 1 0 01-1 1H5a1 1 0 01-1-1zM7 15V9a5 5 0 0110 0v6M12 4v5M9 9h6"/>',
  cam: '<rect x="3" y="7" width="13" height="10" rx="2"/><path d="M16 11l5-3v8l-5-3z"/>',
  data: '<ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3 1.2 0 2.3-.1 3.3-.3"/><circle cx="18" cy="18" r="3"/><path d="M20.2 20.2L22 22"/>',
  set: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/>',
  help: '<circle cx="12" cy="12" r="9"/><path d="M9.1 9a3 3 0 015.8 1c0 2-3 2.5-3 4.5M12 17.5v.01"/>',
  batt: '<rect x="2" y="8" width="17" height="9" rx="2"/><path d="M22 11v3M6 11v3M10 11v3"/>',
  disk: '<ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/>',
  file: '<path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8zM14 3v5h5"/>',
  check: '<path d="M5 13l4 4L19 7"/>', warn: '<path d="M12 3l10 18H2zM12 10v5M12 18v.01"/>', bolt: '<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>', play: '<path d="M8 5v14l11-7z"/>',
  down: '<path d="M12 3v12M7 11l5 5 5-5M5 21h14"/>', plug: '<path d="M9 2v6M15 2v6M6 8h12v4a6 6 0 01-12 0zM12 18v4"/>',
};
const ic = (n, cls = '') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;
const fmtB = (b) => { b = Number(b) || 0; if (b >= 1e12) return (b / 1e12).toFixed(2) + ' TB'; if (b >= 1e9) return (b / 1e9).toFixed(b >= 1e10 ? 0 : 1) + ' GB'; if (b >= 1e6) return Math.round(b / 1e6) + ' MB'; return Math.round(b / 1e3) + ' KB'; };
const ago = (ts) => { if (!ts) return 'never'; const s = Math.max(0, (Date.now() - ts) / 1000); if (s < 5) return 'just now'; if (s < 60) return Math.round(s) + 's ago'; if (s < 3600) return Math.round(s / 60) + ' min ago'; if (s < 86400) return Math.round(s / 3600) + ' h ago'; return Math.round(s / 86400) + ' d ago'; };
const when = (ts) => ts ? new Date(ts).toLocaleString([], { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '-';

const VIEWS = [['docks', 'Docks', 'dock'], ['cams', 'Registered', 'cam'], ['data', 'Data Query', 'data'], ['set', 'Settings', 'set'], ['help', 'Help', 'help']];
let me = null, D = null, view = 'docks', dockSel = null, timer = null, recs = [];

$('#rail').innerHTML = VIEWS.map(([k, l, i]) => `<button class="rb" data-v="${k}" aria-label="${l}"><span class="dot">${ic(i)}</span>${l}</button>`).join('') +
  '<span class="sp"></span><a class="rb" href="/" style="text-decoration:none" aria-label="Live dashboard"><span class="dot" style="--g1:#8A9BB5;--g2:#51607A">' + ic('cam') + '</span>Live</a>';
$('#rail').addEventListener('click', (e) => { const b = e.target.closest('button[data-v]'); if (b) go(b.dataset.v); });
window.addEventListener('hashchange', () => go(location.hash.slice(1), true));

function go(v, fromHash) {
  if (!VIEWS.some((x) => x[0] === v)) v = 'docks';
  view = v; if (!fromHash) history.replaceState(null, '', '#' + v);
  document.querySelectorAll('.rb[data-v]').forEach((b) => b.classList.toggle('on', b.dataset.v === v));
  draw();
}

async function load() {
  try { const r = await fetch('/api/docks'); if (r.status === 401) return (location.href = '/login.html'); D = await r.json(); } catch (e) { return; }
  if (view === 'docks' || view === 'set') draw(); else if (view === 'cams') { if (window.paintCams && $('#cq')) window.paintCams(); else draw(); } else if (view === 'data' && !$('#fc')) draw();
}

/* ---------- views ---------- */
function agentOf() { return (D?.docks || []).slice().sort((a, b) => b.ts - a.ts)[0] || null; }
function head(sub) {
  const a = agentOf(), on = a?.online;
  return `<div class="top"><div><h1>Docking <span>Station</span></h1><p>${sub}</p></div>
    <span class="agent ${on ? 'on' : ''}"><i></i>${on ? 'Dock Agent online' : (a ? 'Dock Agent offline' : (D?.enabled === false ? 'Docking not enabled' : 'No Dock Agent yet'))}<small>${a ? esc(a.id) + ' · ' + ago(a.ts) : ''}</small></span></div>`;
}
function draw() {
  const v = $('#view');
  if (!D) { v.innerHTML = head('Loading…'); return; }
  ({ docks: vDocks, cams: vCams, data: vData, set: vSet, help: vHelp })[view](v);
}

function bayState(c) { return !c ? 'idle' : (c.state || 'connected'); }
function ringSvg(pct) {
  const r = 54, C = 2 * Math.PI * r, off = C * (1 - Math.max(0, Math.min(1, pct)));
  return `<svg viewBox="0 0 120 120"><circle class="tr" cx="60" cy="60" r="${r}" stroke-width="9"/><circle class="vl" cx="60" cy="60" r="${r}" stroke-width="9" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/><circle class="sw" cx="60" cy="60" r="${r}" stroke-width="9" style="transform-box:fill-box"/></svg>`;
}
function bayHTML(i, c) {
  const s = bayState(c), n = String(i + 1).padStart(2, '0');
  const label = { idle: 'Idle', connected: 'Ready', offloading: 'Offloading', synced: 'Synced', error: 'Needs attention' }[s];
  if (!c) return `<article class="bay s-idle"><div class="bhead"><span class="bn">BAY ${n}</span><span class="st">${label}</span></div>
    <div class="ring">${ringSvg(0)}<div class="mid idle"><b>Idle</b></div></div><div class="cid">Empty</div><div class="co"></div>
    <div class="hint">Insert a camera into this bay.<br>It is detected and offloaded automatically.</div></article>`;
  const p = c.progress, pct = s === 'offloading' && p?.bytesTotal ? p.bytesDone / p.bytesTotal : (s === 'synced' ? 1 : 0);
  const mid = s === 'offloading' ? `<b>${Math.round(pct * 100)}%</b><small>${p ? p.index + ' / ' + p.total : ''}</small>`
    : s === 'synced' ? ic('check') + '<small>Synced</small>' : s === 'error' ? ic('warn') + '<small>Error</small>' : ic('plug') + '<small>Docked</small>';
  const low = c.battery != null && c.battery < 20;
  const chips = [
    c.battery != null ? `<span class="ch ${low ? 'low' : ''}">${ic('batt')}${c.battery}%</span>` : '',
    c.storageFreeMb != null ? `<span class="ch">${ic('disk')}${fmtB(c.storageFreeMb * 1e6)} free</span>` : '',
    c.files != null ? `<span class="ch">${ic('file')}${c.files} file${c.files === 1 ? '' : 's'}${c.pendingMb ? ' · ' + fmtB(c.pendingMb * 1e6) : ''}</span>` : '',
  ].join('');
  const foot = s === 'offloading' && p ? `<div class="bar"><i style="width:${Math.round(pct * 100)}%"></i></div><div class="pf">${esc(p.file)} · ${fmtB(p.bytesDone)} of ${fmtB(p.bytesTotal)}</div>`
    : s === 'synced' ? `<div class="bar"><i style="width:100%"></i></div><div class="pf">${c.synced || 0} file${c.synced === 1 ? '' : 's'} verified · ${ago(c.lastSyncTs)}</div>`
    : s === 'error' ? `<div class="pf" style="color:var(--rec);white-space:normal">${esc(c.message || 'A file failed verification')}</div>`
    : `<div class="pf">Waiting for the next sync…</div>`;
  return `<article class="bay has s-${s}" data-cam="${esc(c.cameraId || '')}"><div class="bhead"><span class="bn">BAY ${n}</span><span class="st">${label}</span></div>
    <div class="ring">${ringSvg(pct)}<div class="mid">${mid}</div></div>
    <div class="cid">${esc(c.cameraId || 'Unregistered')}</div><div class="co">${esc(c.company || (c.cameraId ? '' : 'No config.json on this camera'))}</div>
    <div class="chips">${chips}</div>${foot}</article>`;
}
function vDocks(v) {
  const list = D.docks, d = list.find((x) => x.id === dockSel) || list.slice().sort((a, b) => b.ts - a.ts)[0];
  if (d) dockSel = d.id;
  const cams = d && d.online !== false ? d.cameras : (d ? d.cameras : []);
  const bySlot = new Map(); (cams || []).forEach((c) => { if (c.slot != null) bySlot.set(c.slot, c); });
  const total = Math.max(D.slots, ...[...bySlot.keys()].map((k) => k + 1), 1);
  const docked = cams?.length || 0, busy = (cams || []).filter((c) => c.state === 'offloading').length;
  const st = D.storage, usedPct = st.totalBytes ? Math.min(100, ((st.totalBytes - st.freeBytes) / st.totalBytes) * 100) : 0;
  v.innerHTML = head('Plug a camera in and VisionGuard copies its recordings, verifies every file, and keeps the evidence safe.') +
    `<div class="kpis">
      <div class="kpi" style="--c:var(--blue)"><span class="ki">${ic('dock')}</span><div><b>${list.filter((x) => x.online).length}/${list.length}</b><span>Docks online</span></div></div>
      <div class="kpi" style="--c:var(--ok)"><span class="ki">${ic('plug')}</span><div><b>${docked}</b><span>Cameras docked</span></div></div>
      <div class="kpi" style="--c:var(--sel)"><span class="ki">${ic('bolt')}</span><div><b>${busy}</b><span>Offloading now</span></div></div>
      <div class="kpi" style="--c:var(--brand)"><span class="ki">${ic('data')}</span><div><b>${st.todayCount}</b><span>Files today · ${fmtB(st.todayBytes)}</span></div></div></div>` +
    (list.length > 1 ? `<div class="dockpick">${list.map((x) => `<button class="pill ${x.id === dockSel ? 'on' : ''}" data-dock="${esc(x.id)}">${esc(x.id)}</button>`).join('')}</div>` : '') +
    `<div class="bays">${Array.from({ length: total }, (_, i) => bayHTML(i, bySlot.get(i))).join('')}</div>
    <div class="statusbar"><span class="lbl">Server storage</span>
      <div class="meter"><i style="width:${usedPct.toFixed(1)}%"></i></div>
      <span class="num">${fmtB(st.recordingsBytes)} evidence · ${st.recordings} file${st.recordings === 1 ? '' : 's'}${st.totalBytes ? ' · ' + fmtB(st.freeBytes) + ' free of ' + fmtB(st.totalBytes) : ''}</span></div>`;
}
document.addEventListener('click', (e) => {
  const p = e.target.closest('[data-dock]'); if (p) { dockSel = p.dataset.dock; return draw(); }
  const b = e.target.closest('.bay.has'); if (b && b.dataset.cam) { location.hash = '#data'; sessionStorage.setItem('dockq', b.dataset.cam); }
  if (e.target.closest('[data-close]') || e.target === $('#modal')) closeModal();
  const pl = e.target.closest('[data-play]'); if (pl) openMedia(pl.dataset.play);
});

function vCams(v) {
  v.innerHTML = head('Every camera registered to your fleet, and whether it is on a dock right now.') +
    `<div class="card"><div class="bar2"><input id="cq" placeholder="Search camera or company" style="flex:1"><span class="muted" id="cn"></span></div></div>
     <div class="card" style="padding:0"><div class="scroll"><table class="tbl"><thead><tr><th>Camera</th><th>Company</th><th>Status</th><th>Docked</th><th>Last seen</th><th class="r">Recordings</th></tr></thead><tbody id="cb"></tbody></table></div></div>`;
  const paint = () => {
    const docked = new Set(D.docks.flatMap((d) => d.cameras.map((c) => c.cameraId)).filter(Boolean));
    const q = $('#cq').value.trim().toLowerCase();
    const f = D.cameras.filter((c) => !q || (c.cameraId + ' ' + (c.company || '')).toLowerCase().includes(q));
    $('#cn').textContent = f.length + ' camera' + (f.length === 1 ? '' : 's');
    $('#cb').innerHTML = f.length ? f.map((c) => `<tr><td><b>${esc(c.cameraId)}</b></td><td>${esc(c.company || '-')}</td>
      <td><span class="badge ${c.recording ? 'b-rec' : c.online ? 'b-on' : 'b-off'}">${c.recording ? 'Recording' : c.online ? 'Online' : 'Offline'}</span></td>
      <td>${docked.has(c.cameraId) ? '<span class="badge b-dock">On dock</span>' : '<span class="muted">-</span>'}</td>
      <td class="muted">${ago(c.ts)}</td><td class="r">${c.recordings}</td></tr>`).join('') : '<tr><td colspan="6" class="empty">No cameras registered yet.</td></tr>';
  };
  $('#cq').oninput = paint; window.paintCams = paint; paint();
}

function vData(v) {
  const cams = [...new Set([...D.cameras.map((c) => c.cameraId), ...recs.map((r) => r.cameraId)])].sort();
  const pre = sessionStorage.getItem('dockq') || ''; sessionStorage.removeItem('dockq');
  const day = (o) => { const d = new Date(Date.now() - o * 864e5); return d.toISOString().slice(0, 10); };
  v.innerHTML = head('Search the verified evidence offloaded from your cameras. Every file is SHA-256 checked.') +
    `<div class="card"><div class="bar2">
      <select id="fc"><option value="">All cameras</option>${cams.map((c) => `<option ${c === pre ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>
      <input type="date" id="ff" title="From"><input type="date" id="ft" title="To">
      <select id="fy"><option value="">Videos &amp; photos</option><option value="video">Videos</option><option value="image">Photos</option></select>
      <button class="btn pri" id="fgo">Search</button><span class="muted" id="fsum"></span></div></div>
     <div class="card" style="padding:0"><div class="scroll"><table class="tbl"><thead><tr><th>Camera</th><th>File</th><th>Recorded</th><th class="r">Size</th><th>Dock</th><th>SHA-256</th><th></th></tr></thead><tbody id="rb"></tbody></table></div></div>`;
  $('#fgo').onclick = query; ['fc', 'fy', 'ff', 'ft'].forEach((i) => $('#' + i).onchange = query);
  if (pre) $('#fc').value = pre;
  query();
}
async function query() {
  if (view !== 'data' || !$('#fc')) return;
  const q = new URLSearchParams();
  if ($('#fc').value) q.set('camera', $('#fc').value);
  if ($('#fy').value) q.set('type', $('#fy').value);
  if ($('#ff').value) q.set('from', new Date($('#ff').value + 'T00:00:00').getTime());
  if ($('#ft').value) q.set('to', new Date($('#ft').value + 'T00:00:00').getTime() + 864e5);
  const r = await fetch('/api/recordings?' + q); recs = (await r.json()).recordings || [];
  const total = recs.reduce((a, x) => a + x.size, 0);
  $('#fsum').textContent = recs.length + ' result' + (recs.length === 1 ? '' : 's') + ' · ' + fmtB(total) + (recs.length >= 500 ? ' (showing the latest 500)' : '');
  $('#rb').innerHTML = recs.length ? recs.map((x) => `<tr><td><b>${esc(x.cameraId)}</b></td><td class="mono">${esc(x.filename)}</td><td>${when(x.recordedTs || x.uploadedTs)}</td>
    <td class="r">${fmtB(x.size)}</td><td class="muted">${esc(x.dockId || '-')}</td><td class="mono" title="${x.sha256}">${x.sha256.slice(0, 10)}…</td>
    <td style="white-space:nowrap"><button class="btn sm" data-play="${x.id}">${ic('play').replace('<svg', '<svg width="13" height="13"')}Play</button>
    <a class="btn sm" href="/api/recordings/${x.id}/file" download="${esc(x.cameraId)}_${esc(x.filename)}">${ic('down').replace('<svg', '<svg width="13" height="13"')}</a></td></tr>`).join('')
    : '<tr><td colspan="7" class="empty">No recordings match. Dock a camera and they will appear here once verified.</td></tr>';
}
function openMedia(id) {
  const x = recs.find((r) => String(r.id) === String(id)); if (!x) return;
  const src = `/api/recordings/${x.id}/file`, vid = /\.mp4$/i.test(x.filename);
  $('#mbox').innerHTML = `<header><b>${esc(x.cameraId)} · ${esc(x.filename)}</b><button class="btn sm" data-close>Close</button></header>
    ${vid ? `<video src="${src}" controls autoplay playsinline></video>` : `<img src="${src}" alt="">`}
    <div class="mbody muted">${when(x.recordedTs || x.uploadedTs)} · ${fmtB(x.size)} · SHA-256 <span class="mono" style="word-break:break-all">${x.sha256}</span></div>`;
  $('#modal').classList.add('on');
}
function closeModal() { $('#modal').classList.remove('on'); const m = $('#mbox video'); if (m) m.pause(); $('#mbox').innerHTML = ''; }
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

function vSet(v) {
  const a = agentOf();
  const cmd = `# on the PC next to the docking station (Node 22+ and adb installed)\nDOCK_SERVER=${location.origin} \\\nDOCK_TOKEN=<your DOCK_TOKEN> \\\nDOCK_ID=dock-1 \\\nnode dock-agent/agent.js --delete`;
  v.innerHTML = head('How this dock is connected, and the rules every file follows.') +
    `<div class="grid g2" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr)">
      <div class="card"><h3>Dock Agent</h3><dl class="kv">
        <dt>Status</dt><dd>${a?.online ? '<span class="badge b-on">Online</span>' : '<span class="badge b-off">Offline</span>'}</dd>
        <dt>Dock ID</dt><dd>${esc(a?.id || '-')}</dd><dt>Agent version</dt><dd>${esc(a?.agent || '-')}</dd>
        <dt>Last report</dt><dd>${a ? ago(a.ts) : '-'}</dd>
        <dt>Mode</dt><dd>${a ? (a.mode === 'move' ? 'Move: verified files are removed from the camera' : 'Copy: nothing is deleted from the camera') : '-'}</dd>
        <dt>Bays</dt><dd>${D.slots} (set <code>DOCK_SLOTS</code> on the server)</dd>
        <dt>Server docking</dt><dd>${D.enabled ? 'Enabled' : '<span style="color:var(--rec)">Disabled: set DOCK_TOKEN on the server</span>'}</dd></dl></div>
      <div class="card"><h3>Safety rules</h3><dl class="kv">
        <dt>Integrity</dt><dd>SHA-256 on the camera, on the dock PC and again on the server</dd>
        <dt>Delete from camera</dt><dd>Only after the server confirmed the same hash</dd>
        <dt>Recording in progress</dt><dd>Files changed in the last minute are never touched</dd>
        <dt>Access</dt><dd>Company users only see their own cameras' evidence; every download is audited</dd></dl></div></div>
     <div class="card"><h3>Install the Dock Agent</h3><pre class="code">${esc(cmd)}</pre>
       <p class="muted" style="margin:10px 0 0;font-size:13px">The token is the <code>DOCK_TOKEN</code> from the server's environment. It is never shown here.</p></div>`;
}
function vHelp(v) {
  v.innerHTML = head('Everything an operator needs at the dock.') +
    `<div class="steps">
      <div class="step"><b>Plug in</b><span>Seat the camera in any free bay. USB debugging must be on (it is, on VisionGuard cameras).</span></div>
      <div class="step"><b>Wait for the ring</b><span>The bay turns amber and shows progress while files are copied and verified.</span></div>
      <div class="step"><b>Green means safe</b><span>"Synced" means every file is verified on the server. Only then are files removed from the camera.</span></div>
      <div class="step"><b>Take it out</b><span>Remove the camera. The bay goes back to Idle.</span></div></div>
     <div class="card"><h3>Troubleshooting</h3>
      <details><summary>The bay stays Idle although a camera is inserted</summary><p>The Dock Agent is offline or cannot see the camera. Check that the agent is running on the dock PC (the badge at the top should say online) and that <code>adb devices</code> lists the camera.</p></details>
      <details><summary>The bay shows "Unregistered"</summary><p>The camera has no <code>config.json</code> with its ID. Configure the camera with its server address and token first; it is then offloaded under its own ID.</p></details>
      <details><summary>"Needs attention" appears</summary><p>A file failed verification (USB copy or upload). Nothing was deleted from the camera. The agent retries on its next cycle; re-seat the camera if it keeps failing.</p></details>
      <details><summary>Where do the recordings go?</summary><p>They are stored on the VisionGuard server and listed under Data Query, where you can play or download them.</p></details></div>`;
}

portalReady.then((m) => { me = m; go(location.hash.slice(1) || 'docks', true); load(); timer = setInterval(() => { if (!document.hidden) load(); }, 2000); });
</script>
</body>
