# VisionGuard behind nginx on a host that also serves other sites (Parkin).
# Its own file (/etc/nginx/conf.d/visionguard.conf): nothing of the other sites is touched.
# Start with this HTTP block, then `sudo certbot --nginx -d visionguard.smartwaygroup.com.sa --redirect` adds HTTPS to it.
# The app (dashboard, API, socket.io and the signed /live/ FLV streams) listens on 127.0.0.1:3100 (Docker).
# Camera video uplink (RTMP, TCP 1935) is not HTTP: it goes straight to the app on its dedicated IP.
server {
    listen 80;
    listen [::]:80;
    server_name visionguard.smartwaygroup.com.sa;

    client_max_body_size 9g;             # dock uploads of recordings (the app allows 8 GB) and the camera APK
    proxy_request_buffering off;         # stream big uploads to the app instead of spooling them on disk first

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";   # socket.io WebSocket
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;             # live video and progress must not wait in nginx
        proxy_read_timeout 3h;           # long live views
        proxy_send_timeout 3h;           # slow uploads over a weak uplink
    }
}
