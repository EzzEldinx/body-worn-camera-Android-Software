# Reverse proxy for VisionGuard behind nginx (TLS terminates here).
# Dashboard + camera sockets: https://visionguard.smartwaygroup.com.sa  ->  Node on 127.0.0.1:3000
# Live video to browsers (HTTP-FLV): proxied from 127.0.0.1:8000 under /live/
# Camera video uplink (RTMP) is NOT proxied by nginx http: open TCP 1935 to the Node server.
server {
    listen 80;
    server_name visionguard.smartwaygroup.com.sa;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name visionguard.smartwaygroup.com.sa;
    ssl_certificate     /etc/letsencrypt/live/visionguard.smartwaygroup.com.sa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/visionguard.smartwaygroup.com.sa/privkey.pem;
    client_max_body_size 200m;           # OTA APK upload

    location /live/ {                    # signed FLV streams
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    location / {                         # dashboard, API, socket.io (WebSocket upgrade)
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}
