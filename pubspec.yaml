name: swg_bwc
description: Enterprise Body-Worn Camera kiosk for SWG-BWC-04 rugged Android devices.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  wakelock_plus: ^1.2.8
  crypto: ^3.0.6
  rtmp_broadcaster: ^3.1.1
  path_provider: ^2.1.0
  geolocator: ^10.1.0
  socket_io_client: ^2.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true